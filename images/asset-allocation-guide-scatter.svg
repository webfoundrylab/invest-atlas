<path d="M584.7 150H930V383.3H584.7Z M190 383.3H584.7V570H190Z" fill="#e4f1eb" fill-opacity=".78"/>
<g stroke="#dce4e8" stroke-width="1.2">
<path d="M190 150H930M190 196.7H930M190 243.3H930M190 290H930M190 336.7H930M190 383.3H930M190 430H930M190 476.7H930M190 523.3H930M190 570H930"/>
<path d="M190 150V570M288.7 150V570M387.3 150V570M486 150V570M584.7 150V570M683.3 150V570M782 150V570M880.7 150V570"/>
</g>
<path d="M190 383.3H930M584.7 150V570" stroke="#8799a5" stroke-width="2.2"/>
