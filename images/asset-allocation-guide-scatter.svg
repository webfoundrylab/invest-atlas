<text x="174" y="155">＋25%</text><text x="174" y="202">＋20%</text><text x="174" y="249">＋15%</text><text x="174" y="296">＋10%</text><text x="174" y="342">＋5%</text><text x="174" y="389">0%</text><text x="174" y="436">−5%</text><text x="174" y="483">−10%</text><text x="174" y="529">−15%</text><text x="174" y="576">−20%</text>
</g>
