<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc">
<title id="title">米国株と米国10年国債の年間リターン散布図（2000〜2025年の抜粋）と4象限の見方</title>
<desc id="desc">16年分の年間リターン実績を散布図で示す。右上がり方向の組み合わせを淡い緑、右下がり方向の組み合わせを淡い青で示し、相関の見方を補助する。</desc>
<rect width="1000" height="700" rx="24" fill="#f5f8fa"/>
<text x="42" y="48" font-size="28" font-weight="700" fill="#172b3d">株式と国債の年間リターン（実績・抜粋）</text>
<text x="42" y="82" font-size="18" fill="#526575">米国市場｜2000〜2025年から選んだ16年</text>
<g font-size="16" font-weight="700">
<rect x="190" y="103" width="18" height="18" rx="3" fill="#dcefe8"/><text x="216" y="118" fill="#176d65">正の相関（右上がり）</text>
<rect x="465" y="103" width="18" height="18" rx="3" fill="#e1eaf5"/><text x="491" y="118" fill="#3978b8">負の相関（右下がり）</text>
<circle cx="790" cy="112" r="6" fill="#167c72"/><text x="804" y="118" font-size="14" fill="#526575">各年の実績</text>
</g>
<!-- Actual annual-return scatter plot. Both axes use uniform 5% intervals. -->
<rect x="190" y="150" width="740" height="420" fill="#fff" stroke="#8394a1" stroke-width="1.8"/>
<!-- Diagonal pairs are lightly tinted: positive-slope direction vs negative-slope direction. -->
