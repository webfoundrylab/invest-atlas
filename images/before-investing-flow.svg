<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><title>投資を始める前の確認フロー</title><desc>生活資金の確保、目的と期間の整理、リスク確認、商品比較、少額からの検討という順序。</desc><rect width="1200" height="520" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" text-anchor="middle" fill="#172b3d"><text x="600" y="65" font-size="36" font-weight="700">投資を始める前の5ステップ</text><g font-size="23" font-weight="700"><rect x="65" y="125" width="200" height="125" rx="18" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="165" y="170">1. 生活資金</text><text x="165" y="207" font-size="18" font-weight="400">予備費を確保</text><path d="M270 188h30l-10 -10m10 10-10 10" fill="none" stroke="#176d65" stroke-width="4"/><rect x="305" y="125" width="200" height="125" rx="18" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="405" y="170">2. 目的・期間</text><text x="405" y="207" font-size="18" font-weight="400">いつ使うお金か</text><path d="M510 188h30l-10 -10m10 10-10 10" fill="none" stroke="#176d65" stroke-width="4"/><rect x="545" y="125" width="200" height="125" rx="18" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="645" y="170">3. リスク</text><text x="645" y="207" font-size="18" font-weight="400">損失への備え</text><path d="M750 188h30l-10 -10m10 10-10 10" fill="none" stroke="#176d65" stroke-width="4"/><rect x="785" y="125" width="150" height="125" rx="18" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="860" y="170">4. 比較</text><text x="860" y="207" font-size="18" font-weight="400">費用・仕組み</text><path d="M940 188h30l-10 -10m10 10-10 10" fill="none" stroke="#176d65" stroke-width="4"/><rect x="975" y="125" width="160" height="125" rx="18" fill="#d9eee9" stroke="#b8d8d0" stroke-width="3"/><text x="1055" y="170">5. 無理なく</text><text x="1055" y="207" font-size="18" font-weight="400">金額を決める</text></g><rect x="150" y="315" width="900" height="105" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><text x="600" y="355" font-size="24" font-weight="700">どの段階でも、わからない商品は急いで買わない</text><text x="600" y="390" font-size="20" fill="#526574">投資は元本割れの可能性があり、利益は保証されません</text></g></svg>