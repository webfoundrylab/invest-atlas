<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">単利と複利の違い</title><desc id="desc">元本10万円、年率3パーセントの仮定例。単利は毎年3千円、複利は1年目の利益を加えた10万3千円を次の計算の基準にする。</desc>
<rect width="1200" height="650" rx="28" fill="#f4f7f8"/><text x="600" y="58" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3d">利益を運用に戻すと、次の計算対象が変わる</text>
<rect x="55" y="100" width="520" height="450" rx="22" fill="#fff" stroke="#cbd9df" stroke-width="2"/><rect x="625" y="100" width="520" height="450" rx="22" fill="#fff" stroke="#b8d8d0" stroke-width="2"/>
<text x="315" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#315d85">単利の考え方</text><text x="885" y="150" text-anchor="middle" font-size="28" font-weight="700" fill="#176d65">複利の考え方</text>
<rect x="105" y="195" width="420" height="90" rx="14" fill="#eaf1f8"/><text x="315" y="230" text-anchor="middle" font-size="21" fill="#315d85">当初の元本</text><text x="315" y="265" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3d">100,000円</text>
<path d="M315 300 V340" stroke="#315d85" stroke-width="4" stroke-linecap="round"/><path d="M303 329 L315 343 L327 329" fill="none" stroke="#315d85" stroke-width="4"/>
<rect x="105" y="355" width="420" height="80" rx="14" fill="#eaf1f8"/><text x="315" y="385" text-anchor="middle" font-size="20" fill="#315d85">毎年の利益（3％と仮定）</text><text x="315" y="418" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3d">3,000円</text>
<text x="315" y="480" text-anchor="middle" font-size="20" fill="#536879">翌年も元本10万円を基準に計算</text>
<rect x="675" y="195" width="420" height="90" rx="14" fill="#e5f4ef"/><text x="885" y="230" text-anchor="middle" font-size="21" fill="#176d65">当初の元本</text><text x="885" y="265" text-anchor="middle" font-size="32" font-weight="700" fill="#172b3d">100,000円</text>
<path d="M885 300 V340" stroke="#176d65" stroke-width="4" stroke-linecap="round"/><path d="M873 329 L885 343 L897 329" fill="none" stroke="#176d65" stroke-width="4"/>
<rect x="675" y="355" width="420" height="80" rx="14" fill="#e5f4ef"/><text x="885" y="385" text-anchor="middle" font-size="20" fill="#176d65">1年目の利益を加える</text><text x="885" y="418" text-anchor="middle" font-size="30" font-weight="700" fill="#172b3d">103,000円</text>
<text x="885" y="480" text-anchor="middle" font-size="20" fill="#536879">2年目は103,000円を基準に計算</text>
<text x="600" y="595" text-anchor="middle" font-size="20" font-weight="600" fill="#536879">説明用の仮定例：年率3％・税金と費用なし。利益や元本は保証されません。</text></svg>