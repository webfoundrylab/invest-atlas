<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d">
<title id="t">生活防衛資金の必要額の試算例</title><desc id="d">毎月の最低生活費25万円の場合、3か月分は75万円、6か月分は150万円、12か月分は300万円になる。</desc>
<rect width="1000" height="600" rx="28" fill="#f4f1eb"/>
<text x="500" y="64" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#173b45">毎月の最低生活費 25万円 の場合</text>
<text x="500" y="105" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#536879">生活費 × 備える月数 ＝ 必要額（仮定例）</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="75" y="165" width="245" height="300" rx="22" fill="#fff" stroke="#d6b18e" stroke-width="3"/>
<rect x="377" y="165" width="245" height="300" rx="22" fill="#fff" stroke="#9bbfb8" stroke-width="3"/>
<rect x="680" y="165" width="245" height="300" rx="22" fill="#fff" stroke="#9db2d0" stroke-width="3"/>
<text x="197" y="220" font-size="29" font-weight="800" fill="#9b6239">3か月分</text><text x="197" y="310" font-size="54" font-weight="850" fill="#173b45">75万円</text><text x="197" y="365" font-size="23" fill="#536879">25万円 × 3</text>
<rect x="105" y="400" width="185" height="22" rx="11" fill="#f0dfd1"/><rect x="105" y="400" width="46" height="22" rx="11" fill="#b9784c"/>
<text x="499" y="220" font-size="29" font-weight="800" fill="#176d65">6か月分</text><text x="499" y="310" font-size="54" font-weight="850" fill="#173b45">150万円</text><text x="499" y="365" font-size="23" fill="#536879">25万円 × 6</text>
<rect x="407" y="400" width="185" height="22" rx="11" fill="#dcebe6"/><rect x="407" y="400" width="92" height="22" rx="11" fill="#398779"/>
<text x="802" y="220" font-size="29" font-weight="800" fill="#315c8c">12か月分</text><text x="802" y="310" font-size="54" font-weight="850" fill="#173b45">300万円</text><text x="802" y="365" font-size="23" fill="#536879">25万円 × 12</text>
<rect x="710" y="400" width="185" height="22" rx="11" fill="#e1e9f2"/><rect x="710" y="400" width="185" height="22" rx="11" fill="#527cae"/>
</g>
<text x="500" y="525" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" fill="#173b45">どの月数が合うかは、収入・家族・働き方で変わる</text>
<text x="500" y="562" text-anchor="middle" font-family="sans-serif" font-size="19" fill="#536879">一律の正解ではなく、家計に合わせて比較するための試算</text>
</svg>