<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><title>投資信託の費用を3つのタイミングで確認</title><desc>購入時、保有中、換金時の費用をそれぞれ確認し、信託報酬以外の費用も目論見書と運用報告書で調べる。</desc><rect width="1200" height="560" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" fill="#172b3d" text-anchor="middle"><text x="600" y="70" font-size="36" font-weight="700">投資信託の費用はタイミング別に確認</text><rect x="70" y="130" width="320" height="245" rx="20" fill="#fff" stroke="#dce4e8" stroke-width="3"/><circle cx="230" cy="185" r="28" fill="#176d65"/><text x="230" y="194" font-size="25" font-weight="700" fill="#fff">1</text><text x="230" y="245" font-size="27" font-weight="700">購入時</text><text x="230" y="290" font-size="21">購入時手数料</text><text x="230" y="326" font-size="18" fill="#526574">無料の商品もある</text><rect x="440" y="130" width="320" height="245" rx="20" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><circle cx="600" cy="185" r="28" fill="#176d65"/><text x="600" y="194" font-size="25" font-weight="700" fill="#fff">2</text><text x="600" y="245" font-size="27" font-weight="700">保有中</text><text x="600" y="290" font-size="21">信託報酬・その他費用</text><text x="600" y="326" font-size="18" fill="#526574">運用状況で変動する費用も</text><rect x="810" y="130" width="320" height="245" rx="20" fill="#fff" stroke="#dce4e8" stroke-width="3"/><circle cx="970" cy="185" r="28" fill="#176d65"/><text x="970" y="194" font-size="25" font-weight="700" fill="#fff">3</text><text x="970" y="245" font-size="27" font-weight="700">換金時</text><text x="970" y="290" font-size="21">信託財産留保額など</text><text x="970" y="326" font-size="18" fill="#526574">設定のない商品もある</text><rect x="140" y="420" width="920" height="75" rx="16" fill="#d9eee9"/><text x="600" y="466" font-size="24" font-weight="700">目論見書で確認し、運用報告書で実績コストも見る</text></g></svg>