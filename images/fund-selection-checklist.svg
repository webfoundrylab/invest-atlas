<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">投資信託を選ぶ7つの確認項目</title><desc id="desc">投資対象、運用方針、分散、費用、リスク、分配方針、目論見書と運用報告書を確認する。</desc><rect width="1200" height="760" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" fill="#172b3d"><text x="60" y="72" font-size="38" font-weight="700">投資信託を選ぶ7つの確認項目</text><text x="60" y="112" font-size="22" fill="#526574">人気や過去の成績だけでなく、仕組みと条件をチェック</text><g><rect x="60" y="155" width="520" height="112" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><circle cx="105" cy="211" r="25" fill="#176d65"/><text x="105" y="219" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">1</text><text x="150" y="203" font-size="25" font-weight="700">投資対象</text><text x="150" y="237" font-size="19" fill="#526574">株式・債券・REIT・地域</text><rect x="620" y="155" width="520" height="112" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><circle cx="665" cy="211" r="25" fill="#176d65"/><text x="665" y="219" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">2</text><text x="710" y="203" font-size="25" font-weight="700">運用方針・指数</text><text x="710" y="237" font-size="19" fill="#526574">何を目指して運用するか</text><rect x="60" y="290" width="520" height="112" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><circle cx="105" cy="346" r="25" fill="#176d65"/><text x="105" y="354" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">3</text><text x="150" y="338" font-size="25" font-weight="700">分散の範囲</text><text x="150" y="372" font-size="19" fill="#526574">銘柄・国・業種・資産</text><rect x="620" y="290" width="520" height="112" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><circle cx="665" cy="346" r="25" fill="#176d65"/><text x="665" y="354" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">4</text><text x="710" y="338" font-size="25" font-weight="700">費用全体</text><text x="710" y="372" font-size="19" fill="#526574">信託報酬・その他費用</text><rect x="60" y="425" width="520" height="112" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><circle cx="105" cy="481" r="25" fill="#176d65"/><text x="105" y="489" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">5</text><text x="150" y="473" font-size="25" font-weight="700">リスク</text><text x="150" y="507" font-size="19" fill="#526574">価格変動・為替・信用など</text><rect x="620" y="425" width="520" height="112" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><circle cx="665" cy="481" r="25" fill="#176d65"/><text x="665" y="489" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">6</text><text x="710" y="473" font-size="25" font-weight="700">分配方針</text><text x="710" y="507" font-size="19" fill="#526574">分配金の扱い・再投資</text><rect x="200" y="560" width="800" height="88" rx="18" fill="#d9eee9" stroke="#b8d8d0" stroke-width="2"/><circle cx="250" cy="604" r="25" fill="#176d65"/><text x="250" y="612" text-anchor="middle" font-size="23" font-weight="700" fill="#fff">7</text><text x="300" y="596" font-size="25" font-weight="700">公式資料を読む</text><text x="300" y="628" font-size="19" fill="#526574">交付目論見書・最新の運用報告書</text><text x="600" y="706" text-anchor="middle" font-size="20" fill="#526574">確認項目を満たしても、将来の利益を保証するものではありません</text></g></svg>