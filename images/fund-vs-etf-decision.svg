<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>投資信託とETFを比べるときの確認ポイント</title><desc>投資信託は基準価額で一日一回算出される商品が一般的で、ETFは取引所で市場価格により売買する。取引時間、注文方法、費用、流動性を比較する。</desc><rect width="1200" height="600" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" fill="#172b3d"><text x="60" y="70" font-size="36" font-weight="700">投資信託とETF、選ぶ前に比べる4点</text><rect x="70" y="120" width="500" height="300" rx="22" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="320" y="170" text-anchor="middle" font-size="30" font-weight="700">一般的な投資信託</text><text x="110" y="230" font-size="23">✓ 基準価額で購入・換金</text><text x="110" y="280" font-size="23">✓ 金額指定の買付に対応する商品</text><text x="110" y="330" font-size="23">✓ 自動積立を設定できる場合</text><text x="110" y="375" font-size="18" fill="#526574">注文条件は商品・販売会社で異なる</text><rect x="630" y="120" width="500" height="300" rx="22" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="880" y="170" text-anchor="middle" font-size="30" font-weight="700">ETF</text><text x="670" y="230" font-size="23">✓ 取引所で市場価格により売買</text><text x="670" y="280" font-size="23">✓ 取引時間中に価格が変動</text><text x="670" y="330" font-size="23">✓ 指値・成行などの注文</text><text x="670" y="375" font-size="18" fill="#526574">売買単位・流動性なども確認</text><rect x="140" y="455" width="920" height="75" rx="16" fill="#d9eee9"/><text x="600" y="501" text-anchor="middle" font-size="24" font-weight="700">費用・投資対象・流動性を含めて比較。どちらも元本保証ではない</text></g></svg>