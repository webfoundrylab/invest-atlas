<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">投資信託とETFの違い</title><desc id="desc">一般的な非上場投資信託は基準価額で取引され、ETFは取引所の市場価格で売買される。費用や注文方法は商品ごとに確認が必要。</desc><rect width="1200" height="720" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" fill="#172b3d"><text x="60" y="72" font-size="38" font-weight="700">投資信託とETFの違い</text><text x="60" y="112" font-size="22" fill="#526574">どちらも複数の資産に投資できる。売買方法と価格の決まり方に違い。</text><rect x="60" y="150" width="520" height="390" rx="24" fill="#fff" stroke="#dce4e8" stroke-width="2"/><rect x="620" y="150" width="520" height="390" rx="24" fill="#fff" stroke="#dce4e8" stroke-width="2"/><rect x="60" y="150" width="520" height="72" rx="24" fill="#d9eee9"/><rect x="620" y="150" width="520" height="72" rx="24" fill="#dce9f5"/><text x="320" y="197" text-anchor="middle" font-size="28" font-weight="700">一般的な投資信託</text><text x="880" y="197" text-anchor="middle" font-size="28" font-weight="700">ETF（上場投資信託）</text><g font-size="23"><text x="100" y="274" font-weight="700">価格</text><text x="100" y="310">基準価額</text><text x="100" y="370" font-weight="700">売買</text><text x="100" y="406">販売会社を通じて申込</text><text x="100" y="466" font-weight="700">注文</text><text x="100" y="502">金額指定・積立対応も多い</text><text x="660" y="274" font-weight="700">価格</text><text x="660" y="310">取引所の市場価格</text><text x="660" y="370" font-weight="700">売買</text><text x="660" y="406">証券会社から取引所で売買</text><text x="660" y="466" font-weight="700">注文</text><text x="660" y="502">指値・成行など</text></g><rect x="60" y="565" width="1080" height="95" rx="18" fill="#10243a"/><text x="600" y="605" text-anchor="middle" font-size="24" font-weight="700" fill="#fff">費用・投資対象・分配方針・流動性は商品ごとに比較</text><text x="600" y="638" text-anchor="middle" font-size="19" fill="#dce9f5">ETFは市場価格と基準価額が乖離することがあります</text></g></svg>