<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="400 30 1040 460" role="img" aria-labelledby="title desc">
<title id="title">地図とコンパスを組み合わせたInvest Atlasのメインビジュアル</title>
<desc id="desc">アイボリーの余白を左に取り、右側に青い地球儀、地図の輪郭、コンパスローズ、軌道を配した編集的なグラフィック。</desc>
<defs>
 <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fbf8ef"/><stop offset=".58" stop-color="#f0f5ef"/><stop offset="1" stop-color="#dbeef0"/></linearGradient>
 <linearGradient id="edgePaper" gradientUnits="userSpaceOnUse" x1="400" y1="0" x2="1440" y2="0"><stop offset="0" stop-color="#f8f7ef"/><stop offset=".2" stop-color="#f8f7ef"/><stop offset=".58" stop-color="#f0f5ef"/><stop offset="1" stop-color="#dbeef0"/></linearGradient>
 <linearGradient id="ocean" x1=".12" y1=".05" x2=".86" y2=".95"><stop stop-color="#65c2cb"/><stop offset=".45" stop-color="#177ca8"/><stop offset="1" stop-color="#102d59"/></linearGradient>
 <linearGradient id="land" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5eedc"/><stop offset="1" stop-color="#b7d8d4"/></linearGradient>
 <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#153c67"/><stop offset="1" stop-color="#0d2447"/></linearGradient>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7d99a"/><stop offset="1" stop-color="#b98132"/></linearGradient>
