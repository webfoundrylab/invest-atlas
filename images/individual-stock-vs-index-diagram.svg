<text x="902" y="112" text-anchor="middle" font-size="40" font-weight="800" fill="#176d65" font-family="sans-serif">インデックス投資</text>
<rect x="190" y="165" width="216" height="126" rx="18" fill="#f6e5d9" stroke="#b66d43" stroke-width="4"/>
