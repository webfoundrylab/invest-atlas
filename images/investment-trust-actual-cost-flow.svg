<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">投資信託の実質コストを確認する3ステップ</title><desc id="desc">交付目論見書で費用の仕組みを確認し、交付運用報告書で実績コストを見て、同じ期間と指標で比較する流れ。</desc>
<rect width="1200" height="520" rx="24" fill="#f4f7f8"/><text x="60" y="62" font-size="30" font-weight="700" fill="#172b3d">費用は「買う前の説明」と「運用後の実績」を分けて確認</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="55" y="120" width="320" height="235" rx="22" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><circle cx="105" cy="170" r="27" fill="#176d65"/><text x="105" y="179" font-size="25" font-weight="700" fill="#fff">1</text><text x="215" y="222" font-size="28" font-weight="700" fill="#172b3d">交付目論見書</text><text x="215" y="270" font-size="22" fill="#405565">信託報酬の年率</text><text x="215" y="305" font-size="22" fill="#405565">その他の費用・条件</text>
<path d="M390 238 H425 M413 224 L427 238 L413 252" fill="none" stroke="#176d65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="440" y="120" width="320" height="235" rx="22" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><circle cx="490" cy="170" r="27" fill="#176d65"/><text x="490" y="179" font-size="25" font-weight="700" fill="#fff">2</text><text x="600" y="222" font-size="28" font-weight="700" fill="#172b3d">交付運用報告書</text><text x="600" y="270" font-size="22" fill="#405565">総経費率</text><text x="600" y="305" font-size="22" fill="#405565">費用明細・対象期間</text>
<path d="M775 238 H810 M798 224 L812 238 L798 252" fill="none" stroke="#176d65" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="825" y="120" width="320" height="235" rx="22" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><circle cx="875" cy="170" r="27" fill="#176d65"/><text x="875" y="179" font-size="25" font-weight="700" fill="#fff">3</text><text x="985" y="222" font-size="28" font-weight="700" fill="#172b3d">条件をそろえて比較</text><text x="985" y="270" font-size="22" fill="#405565">同じ期間・費用指標</text><text x="985" y="305" font-size="22" fill="#405565">投資対象・運用方針</text>
<rect x="55" y="390" width="1090" height="75" rx="16" fill="#fff0d2" stroke="#ead39b" stroke-width="2"/><text x="85" y="422" text-anchor="start" font-size="22" font-weight="700" fill="#805d16">注意</text><text x="165" y="422" text-anchor="start" font-size="21" fill="#594a2d">「実質コスト」「実質的な信託報酬率」「総経費率」は定義や対象範囲が同じとは限りません。</text><text x="85" y="450" text-anchor="start" font-size="18" fill="#594a2d">数字だけでなく、開示資料・期間・含まれる費用を確認します。</text></g></svg>