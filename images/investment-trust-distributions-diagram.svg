<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">投資信託の分配金の種類</title><desc id="desc">分配金には運用益から支払われる普通分配金と元本の一部払い戻しにあたる元本払戻金があり、支払いは基準価額を下げる要因となる。</desc><rect width="1200" height="650" rx="28" fill="#f4f8f8"/><text x="600" y="58" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#10243a">「分配金＝利益」とは限らない</text><rect x="70" y="110" width="1060" height="105" rx="22" fill="#10243a"/><text x="600" y="155" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#fff">投資信託の資産から投資家へ支払われるお金</text><text x="600" y="190" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#d7e1e8">分配方針・運用状況などを踏まえて決まる</text><path d="M600 220 V260 H310 V290 M600 260 H890 V290" fill="none" stroke="#315d85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M294 274 L310 294 L326 274 M874 274 L890 294 L906 274" fill="none" stroke="#315d85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="70" y="305" width="480" height="150" rx="22" fill="#dcefeb" stroke="#176d65" stroke-width="3"/><text x="310" y="350" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#10243a">普通分配金</text><text x="310" y="392" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#10243a">運用益にあたる部分</text><text x="310" y="427" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#176d65">課税口座では原則課税</text><rect x="650" y="305" width="480" height="150" rx="22" fill="#fff0d2" stroke="#b97816" stroke-width="3"/><text x="890" y="350" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#10243a">元本払戻金</text><text x="890" y="392" text-anchor="middle" font-family="sans-serif" font-size="25" fill="#10243a">投資元本の一部払い戻し</text><text x="890" y="427" text-anchor="middle" font-family="sans-serif" font-size="22" fill="#9a5b08">個別元本がその分減少</text><path d="M310 460 V495 H600 M890 460 V495 H600 V520" fill="none" stroke="#315d85" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 504 L600 524 L616 504" fill="none" stroke="#315d85" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="160" y="535" width="880" height="75" rx="20" fill="#e3ebf7" stroke="#315d85" stroke-width="3"/><text x="600" y="580" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#10243a">分配金の支払いは、基準価額を下げる要因</text></svg>