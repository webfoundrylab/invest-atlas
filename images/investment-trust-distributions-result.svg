<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">分配金と基準価額の合計で運用成果を考える</title><desc id="desc">分配金を100円受け取っても、基準価額の変化によって合計成果は異なる単純化した例。</desc><rect width="1200" height="560" rx="26" fill="#f4f8f8"/><text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#10243a">分配金100円でも、合計成果は変わる</text><text x="600" y="95" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#536879">分配金の受取額 ＋ 基準価額の変化（単純化した例）</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="145" width="350" height="300" rx="20" fill="#fff" stroke="#176d65" stroke-width="3"/><text x="220" y="190" font-size="25" font-weight="800" fill="#10243a">ケースA</text><text x="220" y="235" font-size="22" fill="#536879">分配金</text><text x="220" y="273" font-size="34" font-weight="800" fill="#176d65">＋100円</text><text x="220" y="318" font-size="22" fill="#536879">基準価額の変化</text><text x="220" y="355" font-size="29" font-weight="800" fill="#10243a">±0円</text><path d="M95 380 H345" stroke="#dce4e8" stroke-width="2"/><text x="220" y="418" font-size="25" font-weight="800" fill="#176d65">合計 ＋100円</text><rect x="425" y="145" width="350" height="300" rx="20" fill="#fff" stroke="#b97816" stroke-width="3"/><text x="600" y="190" font-size="25" font-weight="800" fill="#10243a">ケースB</text><text x="600" y="235" font-size="22" fill="#536879">分配金</text><text x="600" y="273" font-size="34" font-weight="800" fill="#176d65">＋100円</text><text x="600" y="318" font-size="22" fill="#536879">基準価額の変化</text><text x="600" y="355" font-size="29" font-weight="800" fill="#9a5b08">−50円</text><path d="M475 380 H725" stroke="#dce4e8" stroke-width="2"/><text x="600" y="418" font-size="25" font-weight="800" fill="#9a5b08">合計 ＋50円</text><rect x="805" y="145" width="350" height="300" rx="20" fill="#fff" stroke="#b34a44" stroke-width="3"/><text x="980" y="190" font-size="25" font-weight="800" fill="#10243a">ケースC</text><text x="980" y="235" font-size="22" fill="#536879">分配金</text><text x="980" y="273" font-size="34" font-weight="800" fill="#176d65">＋100円</text><text x="980" y="318" font-size="22" fill="#536879">基準価額の変化</text><text x="980" y="355" font-size="29" font-weight="800" fill="#b34a44">−200円</text><path d="M855 380 H1105" stroke="#dce4e8" stroke-width="2"/><text x="980" y="418" font-size="25" font-weight="800" fill="#b34a44">合計 −100円</text></g><text x="600" y="500" text-anchor="middle" font-family="sans-serif" font-size="21" fill="#536879">税金・費用・追加購入・売却などを含まない説明用の例</text></svg>