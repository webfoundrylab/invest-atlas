<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">投資信託の信託報酬と費用</title><desc id="desc">信託報酬は保有中に信託財産から間接的に差し引かれる。その他費用もあり、実質的な費用は運用報告書などで確認する。</desc><rect width="1200" height="700" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" fill="#172b3d"><text x="60" y="72" font-size="38" font-weight="700">投資信託のコストを理解する</text><text x="60" y="112" font-size="22" fill="#526574">表示された信託報酬だけで、費用全体が決まるわけではない</text><rect x="60" y="155" width="1080" height="170" rx="24" fill="#fff" stroke="#dce4e8" stroke-width="2"/><rect x="90" y="185" width="300" height="110" rx="16" fill="#d9eee9"/><text x="240" y="226" text-anchor="middle" font-size="25" font-weight="700">信託報酬</text><text x="240" y="263" text-anchor="middle" font-size="20">保有中に日々差し引き</text><text x="435" y="249" font-size="36" font-weight="700" fill="#176d65">＋</text><rect x="500" y="185" width="280" height="110" rx="16" fill="#dce9f5"/><text x="640" y="226" text-anchor="middle" font-size="25" font-weight="700">その他費用</text><text x="640" y="263" text-anchor="middle" font-size="20">売買・監査など</text><text x="820" y="249" font-size="36" font-weight="700" fill="#176d65">＝</text><rect x="875" y="185" width="235" height="110" rx="16" fill="#f9e9c9"/><text x="992" y="226" text-anchor="middle" font-size="24" font-weight="700">実際の負担</text><text x="992" y="263" text-anchor="middle" font-size="19">商品ごとに異なる</text><rect x="60" y="360" width="520" height="245" rx="22" fill="#fff" stroke="#dce4e8" stroke-width="2"/><text x="90" y="405" font-size="27" font-weight="700">計算イメージ（仮定例）</text><text x="90" y="452" font-size="23">保有額 100万円 × 年率 0.1%</text><text x="90" y="490" font-size="23" font-weight="700" fill="#176d65">＝ 年間約1,000円</text><text x="90" y="535" font-size="18" fill="#526574">残高が一定と仮定した単純計算。</text><text x="90" y="566" font-size="18" fill="#526574">実際の金額は日々の残高などで変わります。</text><rect x="620" y="360" width="520" height="245" rx="22" fill="#10243a"/><text x="660" y="405" font-size="27" font-weight="700" fill="#fff">購入前に確認する場所</text><text x="660" y="455" font-size="23" fill="#fff">1. 交付目論見書：信託報酬・費用</text><text x="660" y="500" font-size="23" fill="#fff">2. 運用報告書：実際の費用明細</text><text x="660" y="545" font-size="20" fill="#dce9f5">費用だけでなく投資対象とリスクも比較</text><text x="600" y="650" text-anchor="middle" font-size="19" fill="#526574">低コストでも投資成果や適合性が保証されるわけではありません</text></g></svg>