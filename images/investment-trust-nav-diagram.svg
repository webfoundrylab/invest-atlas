<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">投資信託の基準価額の計算</title><desc id="desc">保有資産の時価と収入から費用などを反映して純資産総額を算出し、総口数で割って基準価額を計算する。</desc><rect width="1200" height="650" rx="28" fill="#f4f8f8"/><text x="600" y="60" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#10243a">基準価額は「資産の価値 ÷ 口数」で考える</text><rect x="70" y="115" width="300" height="170" rx="22" fill="#dcefeb" stroke="#176d65" stroke-width="3"/><text x="220" y="160" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#10243a">保有資産</text><text x="220" y="207" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10243a">株式・債券などの時価</text><text x="220" y="246" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10243a">配当・利子など</text><text x="405" y="215" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#176d65">＋</text><rect x="445" y="115" width="280" height="170" rx="22" fill="#fff0d2" stroke="#b97816" stroke-width="3"/><text x="585" y="160" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#10243a">差し引くもの</text><text x="585" y="207" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10243a">信託報酬などの費用</text><text x="585" y="246" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10243a">分配金の支払いなど</text><path d="M750 200 H815" stroke="#315d85" stroke-width="6" stroke-linecap="round"/><path d="M800 184 L820 200 L800 216" fill="none" stroke="#315d85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><rect x="840" y="115" width="290" height="170" rx="22" fill="#e3ebf7" stroke="#315d85" stroke-width="3"/><text x="985" y="175" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#10243a">純資産総額</text><text x="985" y="220" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10243a">ファンド全体の</text><text x="985" y="255" text-anchor="middle" font-family="sans-serif" font-size="24" fill="#10243a">正味の資産価値</text><path d="M985 300 V360 H600 V395" stroke="#315d85" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 378 L600 398 L616 378" stroke="#315d85" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="300" y="410" width="600" height="105" rx="24" fill="#10243a"/><text x="600" y="454" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#ffffff">純資産総額 ÷ 総口数</text><text x="600" y="490" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#d7e1e8">所定の口数あたりに換算</text><path d="M600 520 V550" stroke="#176d65" stroke-width="6" stroke-linecap="round"/><path d="M584 538 L600 556 L616 538" stroke="#176d65" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="600" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#176d65">基準価額</text></svg>