<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#f4f8fa"/><text x="600" y="55" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="700" fill="#172b3d">投資直後に下落した場合（概念図）</text><g font-family="sans-serif" font-size="26" font-weight="700" fill="#172b3d"><text x="70" y="130">一括：初日に全額投入</text><text x="650" y="130">3か月分割：投入を分ける</text></g><rect x="70" y="160" width="480" height="300" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><rect x="650" y="160" width="480" height="300" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><g fill="#176d65"><rect x="120" y="210" width="380" height="90" rx="12"/><rect x="700" y="210" width="125" height="90" rx="12"/><rect x="850" y="210" width="125" height="90" rx="12"/><rect x="1000" y="210" width="100" height="90" rx="12"/></g><g font-family="sans-serif" font-size="24" font-weight="700" fill="#fff" text-anchor="middle"><text x="310" y="265">100万円</text><text x="762" y="265">約33万</text><text x="912" y="265">約33万</text><text x="1050" y="265">約33万</text></g><path d="M130 345 L210 330 L290 420 L370 400 L490 390" fill="none" stroke="#d97745" stroke-width="8" stroke-linecap="round"/><path d="M710 345 L790 330 L870 420 L950 400 L1090 390" fill="none" stroke="#d97745" stroke-width="8" stroke-linecap="round"/><g font-family="sans-serif" font-size="22" fill="#536879"><text x="310" y="500" text-anchor="middle">投資済み全額が下落の影響</text><text x="890" y="500" text-anchor="middle">後の投入分は安値で買える可能性</text></g><rect x="130" y="540" width="940" height="50" rx="10" fill="#fff4ec"/><text x="600" y="572" text-anchor="middle" font-family="sans-serif" font-size="20" fill="#804526">下落は予測できず、分割が必ず有利になるわけではない</text></svg>