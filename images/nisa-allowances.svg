<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>新NISAの年間投資枠と非課税保有限度額</title><desc>つみたて投資枠は年間120万円、成長投資枠は年間240万円、年間合計360万円。生涯の非課税保有限度額は総額1800万円で、成長投資枠の内数上限は1200万円。</desc><rect width="1200" height="600" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" fill="#172b3d"><text x="60" y="70" font-size="36" font-weight="700">新NISAの枠は「年間」と「生涯」で考える</text><rect x="70" y="125" width="480" height="180" rx="20" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="310" y="170" font-size="25" font-weight="700" text-anchor="middle">年間投資枠</text><rect x="115" y="200" width="145" height="52" rx="10" fill="#176d65"/><text x="187" y="234" font-size="20" fill="#fff" text-anchor="middle">つみたて</text><text x="280" y="234" font-size="23" font-weight="700">120万円</text><rect x="115" y="260" width="145" height="30" rx="8" fill="#b7dcd4"/><text x="280" y="283" font-size="23" font-weight="700">成長 240万円</text><rect x="620" y="125" width="510" height="180" rx="20" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="875" y="170" font-size="25" font-weight="700" text-anchor="middle">年間合計の上限</text><text x="875" y="245" font-size="58" font-weight="800" text-anchor="middle" fill="#176d65">360万円</text><text x="875" y="280" font-size="18" text-anchor="middle" fill="#526574">両枠を併用した場合</text><rect x="70" y="345" width="1060" height="155" rx="20" fill="#d9eee9" stroke="#b8d8d0" stroke-width="3"/><text x="110" y="390" font-size="25" font-weight="700">生涯の非課税保有限度額</text><text x="110" y="455" font-size="54" font-weight="800" fill="#176d65">1,800万円</text><text x="520" y="435" font-size="23" font-weight="700">うち成長投資枠は1,200万円まで</text><text x="520" y="470" font-size="18" fill="#526574">売却した商品の簿価分は翌年以降に再利用可能</text><text x="600" y="555" font-size="18" text-anchor="middle" fill="#526574">制度の詳細・対象商品は金融庁などの最新公式情報を確認してください</text></g></svg>