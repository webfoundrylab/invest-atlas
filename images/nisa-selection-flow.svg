<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520"><title>NISAで商品を選ぶ手順</title><desc>資産形成の目的と期間を決め、投資対象とリスクを確認し、コストと公式資料を比較して、無理のない投資額を決める。</desc><rect width="1200" height="520" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" text-anchor="middle" fill="#172b3d"><text x="600" y="65" font-size="36" font-weight="700">NISAで商品を選ぶ手順</text><g font-size="23" font-weight="700"><rect x="70" y="135" width="235" height="130" rx="18" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="187" y="183">目的・期間</text><text x="187" y="222" font-size="18" font-weight="400">いつ使う資金か</text><path d="M310 200h45l-12 -12m12 12-12 12" fill="none" stroke="#176d65" stroke-width="4"/><rect x="360" y="135" width="235" height="130" rx="18" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="477" y="183">投資対象</text><text x="477" y="222" font-size="18" font-weight="400">何に投資するか</text><path d="M600 200h45l-12 -12m12 12-12 12" fill="none" stroke="#176d65" stroke-width="4"/><rect x="650" y="135" width="235" height="130" rx="18" fill="#fff" stroke="#b8d8d0" stroke-width="3"/><text x="767" y="183">費用・リスク</text><text x="767" y="222" font-size="18" font-weight="400">目論見書を読む</text><path d="M890 200h45l-12 -12m12 12-12 12" fill="none" stroke="#176d65" stroke-width="4"/><rect x="940" y="135" width="190" height="130" rx="18" fill="#d9eee9" stroke="#b8d8d0" stroke-width="3"/><text x="1035" y="183">投資額</text><text x="1035" y="222" font-size="18" font-weight="400">無理なく設定</text></g><rect x="160" y="330" width="880" height="95" rx="18" fill="#fff" stroke="#dce4e8" stroke-width="2"/><text x="600" y="370" font-size="24" font-weight="700">NISAは口座の制度。投資商品のリスクは残る</text><text x="600" y="402" font-size="19" fill="#526574">対象商品・制度条件は最新の金融庁公式情報を確認</text></g></svg>