<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="t d"><title id="t">新NISAの仕組み</title><desc id="d">つみたて投資枠年間120万円と成長投資枠年間240万円は併用可能。合計年間360万円、非課税保有限度額は1800万円で成長投資枠は1200万円まで。売却した商品の取得金額分は翌年以降に再利用できる。</desc><rect width="1200" height="800" rx="28" fill="#f4f7f8"/><g font-family="sans-serif"><text x="60" y="70" font-size="38" font-weight="700" fill="#10243a">新NISAの仕組み</text><text x="60" y="110" font-size="22" fill="#526574">投資の利益が非課税になる制度。元本保証ではありません。</text><rect x="60" y="145" width="1080" height="310" rx="24" fill="#fff" stroke="#dce4e8" stroke-width="2"/><text x="600" y="188" text-anchor="middle" font-size="26" font-weight="700" fill="#10243a">1つの口座で2つの投資枠を併用</text><rect x="95" y="220" width="470" height="155" rx="18" fill="#dcefeb" stroke="#9bcfc4" stroke-width="2"/><text x="330" y="258" text-anchor="middle" font-size="25" font-weight="700" fill="#176d65">つみたて投資枠</text><text x="330" y="308" text-anchor="middle" font-size="38" font-weight="700" fill="#10243a">年間120万円</text><text x="330" y="345" text-anchor="middle" font-size="18" fill="#405565">一定の投資信託など</text><rect x="635" y="220" width="470" height="155" rx="18" fill="#e4ecf8" stroke="#b5c9e6" stroke-width="2"/><text x="870" y="258" text-anchor="middle" font-size="25" font-weight="700" fill="#315c8c">成長投資枠</text><text x="870" y="308" text-anchor="middle" font-size="38" font-weight="700" fill="#10243a">年間240万円</text><text x="870" y="345" text-anchor="middle" font-size="18" fill="#405565">上場株式・投資信託など</text><rect x="95" y="397" width="1010" height="40" rx="12" fill="#10243a"/><text x="600" y="425" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">年間投資枠の合計：最大360万円</text><rect x="60" y="480" width="520" height="155" rx="22" fill="#fff" stroke="#dce4e8" stroke-width="2"/><text x="90" y="520" font-size="22" font-weight="700" fill="#526574">非課税保有限度額</text><text x="320" y="575" text-anchor="middle" font-size="46" font-weight="700" fill="#176d65">1,800万円</text><text x="320" y="610" text-anchor="middle" font-size="19" fill="#405565">うち成長投資枠は最大1,200万円</text><rect x="610" y="480" width="530" height="155" rx="22" fill="#fff" stroke="#dce4e8" stroke-width="2"/><text x="640" y="520" font-size="22" font-weight="700" fill="#526574">商品を売却したら？</text><text x="875" y="565" text-anchor="middle" font-size="25" font-weight="700" fill="#176d65">翌年以降に枠を再利用</text><text x="640" y="602" font-size="18" fill="#405565">売却額ではなく取得金額分が復活</text><rect x="60" y="665" width="1080" height="90" rx="18" fill="#fff0d2" stroke="#ead39b" stroke-width="2"/><text x="90" y="703" font-size="23" font-weight="700" fill="#805d16">注意：投資には元本割れのリスクがあります</text><text x="90" y="735" font-size="18" fill="#594a2d">制度確認日：2026年10月24日。最新情報は金融庁・国税庁の公式資料を確認してください。</text></g></svg>