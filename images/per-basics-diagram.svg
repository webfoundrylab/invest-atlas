<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">PERの計算と変化</title><desc id="desc">株価2000円をEPS100円で割るとPER20倍。株価が3000円なら30倍、EPSが150円なら約13.3倍。</desc>
<rect width="1000" height="520" rx="24" fill="#f5f8f7"/><text x="500" y="58" text-anchor="middle" font-size="34" font-weight="800" fill="#294d50">PER ＝ 株価 ÷ EPS</text>
<rect x="70" y="100" width="360" height="180" rx="18" fill="#fff" stroke="#287e74" stroke-width="4"/><text x="250" y="145" text-anchor="middle" font-size="25" fill="#536879">株価</text><text x="250" y="195" text-anchor="middle" font-size="42" font-weight="800" fill="#294d50">2,000円</text><text x="250" y="245" text-anchor="middle" font-size="25" fill="#536879">÷ EPS 100円</text>
<path d="M455 190 H535" stroke="#536879" stroke-width="8" stroke-linecap="round"/><path d="M515 168 L540 190 L515 212" fill="none" stroke="#536879" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="570" y="100" width="360" height="180" rx="18" fill="#f7e9df" stroke="#d78652" stroke-width="4"/><text x="750" y="145" text-anchor="middle" font-size="25" fill="#a65e39">PER</text><text x="750" y="220" text-anchor="middle" font-size="62" font-weight="800" fill="#a65e39">20倍</text>
<text x="500" y="340" text-anchor="middle" font-size="27" font-weight="800" fill="#294d50">どちらが変わるかで倍率も変化</text>
<rect x="55" y="380" width="420" height="105" rx="16" fill="#e7f1ef"/><text x="265" y="418" text-anchor="middle" font-size="23" font-weight="700" fill="#294d50">株価 3,000円 / EPS 100円</text><text x="265" y="462" text-anchor="middle" font-size="34" font-weight="800" fill="#176d65">PER 30倍</text>
<rect x="525" y="380" width="420" height="105" rx="16" fill="#f7e9df"/><text x="735" y="418" text-anchor="middle" font-size="23" font-weight="700" fill="#8c5738">株価 2,000円 / EPS 150円</text><text x="735" y="462" text-anchor="middle" font-size="34" font-weight="800" fill="#a65e39">PER 約13.3倍</text></svg>