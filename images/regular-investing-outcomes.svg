<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560"><title>積立投資でも成果は変動する</title><desc>積立は購入時期を分散する方法だが、上昇・横ばい・下落など価格の経路によって評価額は異なり、損失を防ぐ保証はない。</desc><rect width="1200" height="560" rx="28" fill="#f4f7f8"/><g font-family="sans-serif" fill="#172b3d"><text x="60" y="70" font-size="36" font-weight="700">積立投資でも、結果は価格の動きで変わる</text><g stroke="#dce4e8" stroke-width="2"><path d="M110 150v290h980" fill="none"/></g><path d="M130 390 L300 350 L470 320 L640 270 L810 210 L980 155 L1070 125" fill="none" stroke="#176d65" stroke-width="7" stroke-linecap="round"/><path d="M130 390 L300 340 L470 370 L640 310 L810 350 L980 300 L1070 320" fill="none" stroke="#d59b38" stroke-width="7" stroke-linecap="round"/><path d="M130 390 L300 360 L470 385 L640 410 L810 380 L980 425 L1070 435" fill="none" stroke="#bd6b6b" stroke-width="7" stroke-linecap="round"/><text x="800" y="120" font-size="20" fill="#176d65">上昇する例</text><text x="800" y="280" font-size="20" fill="#a8751c">上下する例</text><text x="800" y="470" font-size="20" fill="#a54e4e">下落する例</text><text x="600" y="510" text-anchor="middle" font-size="19" fill="#526574">模式図（実際の市場データではありません）。積立でも元本割れの可能性があります。</text></g></svg>