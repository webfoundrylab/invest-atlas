<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc">
<title id="title">投資元本の20%下落による損失額の比較</title>
<desc id="desc">投資元本100万円、300万円、500万円がそれぞれ20%下落した場合の損失額を、元本に比例する棒と赤い損失部分で比較する図。</desc>
<rect width="1000" height="610" rx="24" fill="#f5f3ef"/>
<text id="title" x="500" y="54" text-anchor="middle" font-size="31" font-weight="800" fill="#293b4a">同じ20%の下落でも、投資額で損失額は変わる</text>
<text x="500" y="91" text-anchor="middle" font-size="20" fill="#687783">棒全体が投資元本、赤い部分が値下がりした20%分</text>

<g font-family="sans-serif">
  <g>
    <text x="72" y="166" font-size="25" font-weight="800" fill="#293b4a">投資元本 100万円</text>
    <text x="360" y="166" font-size="22" font-weight="700" fill="#536777">下落率 −20%</text>
    <text x="680" y="166" font-size="22" font-weight="800" fill="#a94e3e">損失額 −20万円</text>
    <rect x="360" y="183" width="100" height="42" rx="8" fill="#cbd9df"/>
    <rect x="440" y="183" width="20" height="42" rx="5" fill="#c36b54"/>
    <text x="360" y="253" font-size="19" fill="#536777">値下がり後：80万円</text>
  </g>

  <g>
    <text x="72" y="326" font-size="25" font-weight="800" fill="#293b4a">投資元本 300万円</text>
    <text x="360" y="326" font-size="22" font-weight="700" fill="#536777">下落率 −20%</text>
    <text x="680" y="326" font-size="22" font-weight="800" fill="#a94e3e">損失額 −60万円</text>
    <rect x="360" y="343" width="300" height="42" rx="8" fill="#cbd9df"/>
    <rect x="600" y="343" width="60" height="42" rx="5" fill="#c36b54"/>
    <text x="360" y="413" font-size="19" fill="#536777">値下がり後：240万円</text>
  </g>

  <g>
    <text x="72" y="486" font-size="25" font-weight="800" fill="#293b4a">投資元本 500万円</text>
    <text x="360" y="486" font-size="22" font-weight="700" fill="#536777">下落率 −20%</text>
    <text x="680" y="486" font-size="22" font-weight="800" fill="#a94e3e">損失額 −100万円</text>
    <rect x="360" y="503" width="500" height="42" rx="8" fill="#cbd9df"/>
    <rect x="760" y="503" width="100" height="42" rx="5" fill="#c36b54"/>
    <text x="360" y="573" font-size="19" fill="#536777">値下がり後：400万円</text>
  </g>
</g>
</svg>