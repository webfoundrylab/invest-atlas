<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc" font-family="sans-serif"><title id="title">ROEを3要素に分解して見る</title><desc id="desc">利益率、資産回転率、財務レバレッジの掛け算でROEを理解し、比較時に財務リスクも確認する図。</desc><rect width="1000" height="560" rx="24" fill="#f5f8fa"/><text x="500" y="55" font-size="30" font-weight="700" text-anchor="middle" fill="#17354a">ROEを分解して背景を読む</text><g font-family="sans-serif" text-anchor="middle"><rect x="45" y="105" width="270" height="150" rx="18" fill="#dceee9" stroke="#478878" stroke-width="2"/><text x="180" y="150" font-size="24" fill="#1c4c43">売上高純利益率</text><text x="180" y="205" font-size="34" font-weight="700" fill="#1c4c43">利益 ÷ 売上</text><text x="335" y="190" font-size="38" fill="#526b7c">×</text><rect x="365" y="105" width="270" height="150" rx="18" fill="#e2eaf5" stroke="#6c8db6" stroke-width="2"/><text x="500" y="150" font-size="24" fill="#294b70">総資産回転率</text><text x="500" y="205" font-size="34" font-weight="700" fill="#294b70">売上 ÷ 資産</text><text x="655" y="190" font-size="38" fill="#526b7c">×</text><rect x="685" y="105" width="270" height="150" rx="18" fill="#f5e8d7" stroke="#bd8a4c" stroke-width="2"/><text x="820" y="150" font-size="24" fill="#754b1e">財務レバレッジ</text><text x="820" y="205" font-size="34" font-weight="700" fill="#754b1e">資産 ÷ 自己資本</text><path d="M500 270v55" stroke="#526b7c" stroke-width="4"/><path d="M488 313l12 14 12-14" fill="none" stroke="#526b7c" stroke-width="4"/><rect x="280" y="335" width="440" height="80" rx="18" fill="#173f59"/><text x="500" y="385" font-size="34" font-weight="700" fill="#fff">ROE（自己資本利益率）</text><path d="M500 425v40" stroke="#526b7c" stroke-width="4"/><path d="M488 453l12 14 12-14" fill="none" stroke="#526b7c" stroke-width="4"/><rect x="110" y="475" width="780" height="60" rx="14" fill="#fff" stroke="#cbd7df" stroke-width="2"/><text x="500" y="513" font-size="23" fill="#294457">比較では「利益の質・借入・自己資本の変化」も確認</text></g></svg>