<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="t d">
<title id="t">100株単位と1株からの単元未満株の購入代金比較</title>
<desc id="d">株価2,000円の例で、通常の100株は20万円、単元未満株の1株は2,000円から購入できる。</desc>
<rect width="1200" height="660" rx="24" fill="#f7faf9"/>
<text x="600" y="68" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#173b4d">株価2,000円の銘柄を買う場合</text>
<rect x="70" y="120" width="500" height="410" rx="24" fill="#fff" stroke="#267b6c" stroke-width="4"/>
<rect x="630" y="120" width="500" height="410" rx="24" fill="#fff" stroke="#5487bd" stroke-width="4"/>
<text x="320" y="185" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#176d65">通常の単元株</text>
<text x="880" y="185" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#315f98">単元未満株</text>
<g fill="#5eb29a" stroke="#176d65" stroke-width="2">
<rect x="135" y="235" width="52" height="52" rx="8"/><rect x="205" y="235" width="52" height="52" rx="8"/><rect x="275" y="235" width="52" height="52" rx="8"/><rect x="345" y="235" width="52" height="52" rx="8"/><rect x="415" y="235" width="52" height="52" rx="8"/><rect x="135" y="305" width="52" height="52" rx="8"/><rect x="205" y="305" width="52" height="52" rx="8"/><rect x="275" y="305" width="52" height="52" rx="8"/><rect x="345" y="305" width="52" height="52" rx="8"/><rect x="415" y="305" width="52" height="52" rx="8"/>
</g>
<g fill="#8bb5e3" stroke="#315f98" stroke-width="3"><rect x="852" y="258" width="56" height="56" rx="9"/></g>
<text x="320" y="425" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#173b4d">100株 × 2,000円</text>
<text x="880" y="425" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#173b4d">1株 × 2,000円</text>
<text x="320" y="490" text-anchor="middle" font-family="sans-serif" font-size="54" font-weight="900" fill="#176d65">20万円</text>
<text x="880" y="490" text-anchor="middle" font-family="sans-serif" font-size="54" font-weight="900" fill="#315f98">2,000円</text>
<text x="600" y="595" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="750" fill="#405565">必要資金は株数で変わる（手数料等を除く）</text>
</svg>