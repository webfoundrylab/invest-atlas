<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="t d">
<title id="t">VIXの算出イメージ</title><desc id="d">S&amp;P 500の複数のコール・プットオプションの価格から、市場が織り込む変動率を集計し、満期約30日の予想変動率としてVIXを算出する。</desc>
<rect width="1200" height="620" rx="24" fill="#f5f9fb"/>
<g font-family="sans-serif" text-anchor="middle" fill="#17354a">
<rect x="55" y="70" width="310" height="175" rx="22" fill="#fff" stroke="#9db7c7" stroke-width="3"/>
<text x="210" y="122" font-size="30" font-weight="800">S&amp;P 500</text><text x="210" y="168" font-size="23">株価指数を対象にした</text><text x="210" y="204" font-size="23">オプション市場</text>
<rect x="445" y="70" width="310" height="175" rx="22" fill="#fff" stroke="#9db7c7" stroke-width="3"/>
<text x="600" y="122" font-size="30" font-weight="800">オプション価格</text><text x="600" y="168" font-size="23">複数の権利行使価格</text><text x="600" y="204" font-size="23">コール・プットを集計</text>
<rect x="835" y="70" width="310" height="175" rx="22" fill="#eaf4f2" stroke="#168477" stroke-width="3"/>
<text x="990" y="122" font-size="30" font-weight="800" fill="#126d62">予想変動率</text><text x="990" y="168" font-size="23">満期約30日に調整</text><text x="990" y="204" font-size="23">年率換算の標準偏差</text>
<g stroke="#668395" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M375 157H430l-14 -12m14 12l-14 12"/><path d="M765 157H820l-14 -12m14 12l-14 12"/></g>
<rect x="385" y="340" width="430" height="190" rx="26" fill="#17354a"/>
<text x="600" y="410" font-size="27" font-weight="700" fill="#d8e8ef">Cboe Volatility Index</text>
<text x="600" y="480" font-size="58" font-weight="900" fill="#fff">VIX</text>
<text x="600" y="570" font-size="23" fill="#536879">方向ではなく、変動の大きさを示す</text>
<path d="M990 260V310H600V330" stroke="#168477" stroke-width="5" fill="none" stroke-linecap="round"/>
</g></svg>