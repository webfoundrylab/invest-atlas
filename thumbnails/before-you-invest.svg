<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資を始める前に｜確認したい7つのこと</title><desc id="desc">商品を選ぶ前に、生活資金を確保し、目的と期間を決め、リスクと費用を確認する3段階の準備フロー。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf8f3"/><stop offset="1" stop-color="#d5eee6"/></linearGradient><linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f8fcfa"/></linearGradient></defs>
<rect width="1200" height="675" rx="24" fill="url(#bg)"/><rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#138578" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#138578">PREPARE TO INVEST</text><text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17334a">投資を始める前に</text><text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">確認したい7つのこと</text>
<text x="600" y="220" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#23675e">商品選びの前に、3段階で準備する</text>
<path d="M375 415H420M780 415H825" stroke="#47998a" stroke-width="10" stroke-linecap="round"/><path d="M405 398l18 17-18 17M810 398l18 17-18 17" fill="none" stroke="#47998a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect x="55" y="265" width="320" height="300" rx="28" fill="url(#card)" stroke="#9acfc2" stroke-width="4"/><circle cx="215" cy="352" r="58" fill="#e3f5ec"/><rect x="168" y="329" width="94" height="57" rx="12" fill="#247b63"/><path d="M180 329v-12q0-12 12-12h42q12 0 12 12v12" fill="none" stroke="#247b63" stroke-width="8"/><rect x="218" y="344" width="43" height="25" rx="8" fill="#f5c96c"/><circle cx="229" cy="356" r="4" fill="#815c17"/><text x="215" y="455" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#205b4d">① 家計を守る</text><text x="215" y="502" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">生活費・予備資金を</text><text x="215" y="539" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">先に確保</text></g>
<g><rect x="440" y="265" width="320" height="300" rx="28" fill="url(#card)" stroke="#9acfc2" stroke-width="4"/><circle cx="600" cy="352" r="58" fill="#e3f5ec"/><circle cx="600" cy="352" r="37" fill="none" stroke="#277c70" stroke-width="8"/><circle cx="600" cy="352" r="20" fill="none" stroke="#e2b65d" stroke-width="8"/><circle cx="600" cy="352" r="6" fill="#277c70"/><path d="M620 330l22-22" stroke="#277c70" stroke-width="8" stroke-linecap="round"/><text x="600" y="455" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#205b4d">② 目的を決める</text><text x="600" y="502" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">何のために・いつ</text><text x="600" y="539" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">使うお金か整理</text></g>
<g><rect x="825" y="265" width="320" height="300" rx="28" fill="url(#card)" stroke="#9acfc2" stroke-width="4"/><circle cx="985" cy="352" r="58" fill="#e3f5ec"/><path d="M985 311l42 16v31q0 31-42 46-42-15-42-46v-31Z" fill="#277c70"/><path d="M964 353l15 15 29-34" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><text x="985" y="455" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#205b4d">③ 条件を確かめる</text><text x="985" y="502" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">値下がり・分散・</text><text x="985" y="539" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">費用・商品の仕組み</text></g>
<path d="M170 607H1030" stroke="#8fc8b9" stroke-width="4" stroke-linecap="round"/><circle cx="170" cy="607" r="8" fill="#277c70"/><circle cx="600" cy="607" r="8" fill="#277c70"/><circle cx="1030" cy="607" r="8" fill="#277c70"/>
</svg>