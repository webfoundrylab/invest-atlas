<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">NISAでの投資信託選び｜7つのチェックポイント</title>
<desc id="desc">投資信託を選ぶ際に、投資対象やリスク、費用などを確認するイメージ図。</desc>
<rect width="1200" height="675" rx="28" fill="#eaf5f2"/>
<rect x="32" y="28" width="1136" height="210" rx="22" fill="#fff" stroke="#d4e4e0" stroke-width="2"/>
<text x="72" y="77" font-family="sans-serif" font-size="30" font-weight="700" letter-spacing="1" fill="#087f75">CHOOSING A FUND</text>
<text x="72" y="137" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">NISAでの投資信託選び</text>
<text x="72" y="190" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">7つのチェックポイント</text>
<rect x="32" y="258" width="1136" height="385" rx="22" fill="#f8fcfb" stroke="#d4e4e0" stroke-width="2"/>
<g transform="translate(80 315)">
  <rect x="0" y="0" width="300" height="230" rx="24" fill="#d8f4eb" stroke="#8fd5c5" stroke-width="3"/>
  <circle cx="150" cy="76" r="42" fill="#087f75"/>
  <path d="M128 76l15 15 30-34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="150" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#175d57">投資対象</text>
  <text x="150" y="195" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#386f69">何に投資する？</text>
</g>
<g transform="translate(450 315)">
  <rect x="0" y="0" width="300" height="230" rx="24" fill="#e4effb" stroke="#a7c9ef" stroke-width="3"/>
  <path d="M58 112l47-45 42 24 52-58" fill="none" stroke="#2775c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M178 33h22v22" fill="none" stroke="#2775c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M60 139h180" stroke="#8fb5e3" stroke-width="5" stroke-linecap="round"/>
  <text x="150" y="177" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#20568c">リスク</text>
  <text x="150" y="209" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#426f9f">値動きはどの程度？</text>
</g>
<g transform="translate(820 315)">
  <rect x="0" y="0" width="300" height="230" rx="24" fill="#fff0d7" stroke="#f2cc83" stroke-width="3"/>
  <circle cx="150" cy="78" r="45" fill="#f2a51a"/>
  <text x="150" y="94" text-anchor="middle" font-family="sans-serif" font-size="49" font-weight="800" fill="#fff">¥</text>
  <text x="150" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#885a0b">費用</text>
  <text x="150" y="195" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#946b28">コストはいくら？</text>
</g>
<rect x="350" y="570" width="500" height="48" rx="24" fill="#087f75"/>
<text x="600" y="602" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="800" fill="#fff">自分の目的に合うか確認</text>
</svg>