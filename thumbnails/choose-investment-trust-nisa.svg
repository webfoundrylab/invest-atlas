<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">NISAでの投資信託選び｜7つのチェックポイント</title>
<desc id="desc">投資対象、値動き、費用などの違いを3つの投資先カードで見比べ、目的に合う投資信託を選ぶイメージ図。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff1d9"/><stop offset="1" stop-color="#f8d9cf"/></linearGradient>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#fffaf4"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<!-- fixed shared title panel -->
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#e8c9b6" stroke-width="2"/>
<text x="64" y="62" font-family="sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#b45c36">FUND SELECTION</text>
<text x="64" y="111" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">NISAでの投資信託選び</text>
<text x="64" y="151" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">7つのチェックポイント</text>
<!-- distinct illustration: compare investment destinations, then choose by purpose -->
<path d="M0 604Q190 565 390 604T790 594T1200 600V675H0Z" fill="#f0bda6" opacity=".65"/>
<g>
  <!-- stocks / companies card -->
  <rect x="64" y="236" width="300" height="280" rx="26" fill="#b7795c" opacity=".16"/>
  <rect x="54" y="226" width="300" height="280" rx="26" fill="url(#card)" stroke="#d9a28a" stroke-width="4"/>
  <circle cx="204" cy="324" r="65" fill="#ffe2c9"/>
  <path d="M158 362V322H184V362M192 362V291H218V362M226 362V308H252V362" fill="#d8784e" stroke="#9f4d2e" stroke-width="4" stroke-linejoin="round"/>
  <path d="M148 369H262" stroke="#9f4d2e" stroke-width="6" stroke-linecap="round"/>
  <text x="204" y="424" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#8f472d">株式・企業</text>
  <text x="204" y="466" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#66534b">値動きと成長性</text>
  <!-- world / regions card -->
  <rect x="450" y="236" width="300" height="280" rx="26" fill="#688e9e" opacity=".16"/>
  <rect x="440" y="226" width="300" height="280" rx="26" fill="url(#card)" stroke="#91b8c5" stroke-width="4"/>
  <circle cx="590" cy="324" r="65" fill="#dceff4" stroke="#4d94a6" stroke-width="5"/>
  <ellipse cx="590" cy="324" rx="30" ry="65" fill="none" stroke="#4d94a6" stroke-width="4"/>
  <path d="M528 324H652M539 292Q590 309 641 292M539 356Q590 339 641 356" fill="none" stroke="#4d94a6" stroke-width="4"/>
  <path d="M552 290l18-12 16 7 13-10 19 10-8 17-20 4-8 18-17-6-4-16Z" fill="#53a78d"/>
  <path d="M605 335l16 8 4 20-14 13-12-18Z" fill="#53a78d"/>
  <text x="590" y="424" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#276b7b">地域・資産</text>
  <text x="590" y="466" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#526a72">分散の範囲</text>
  <!-- costs / structure card -->
  <rect x="836" y="236" width="300" height="280" rx="26" fill="#8e9a53" opacity=".18"/>
  <rect x="826" y="226" width="300" height="280" rx="26" fill="url(#card)" stroke="#b5bd7b" stroke-width="4"/>
  <circle cx="976" cy="324" r="65" fill="#edf0d3"/>
  <circle cx="976" cy="324" r="42" fill="none" stroke="#7b8b35" stroke-width="12"/>
  <path d="M976 282A42 42 0 0 1 1018 324H976Z" fill="#d3a13f"/>
  <path d="M976 324L1018 324A42 42 0 0 1 956 364Z" fill="#4d9b83"/>
  <circle cx="976" cy="324" r="15" fill="#fff"/>
  <text x="976" y="424" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#5d7025">費用・リスク</text>
  <text x="976" y="466" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#62694a">保有コストも確認</text>
</g>
<!-- comparison lines flow into the selection result -->
<g fill="none" stroke="#9e624b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <path d="M204 518V544H510"/>
  <path d="M590 518V544"/>
  <path d="M976 518V544H670"/>
  <path d="M590 544V565"/>
</g>
<path d="M575 555L590 573L605 555" fill="none" stroke="#9e624b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="370" y="574" width="440" height="76" rx="38" fill="#9e4f32"/>
<circle cx="414" cy="612" r="20" fill="#fff"/>
<path d="M404 612l7 7 14-16" fill="none" stroke="#9e4f32" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="604" y="623" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#fff">自分の目的に合う商品を選ぶ</text>
</svg>