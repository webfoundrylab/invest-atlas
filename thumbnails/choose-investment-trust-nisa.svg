<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">NISAでの投資信託選び｜7つのチェックポイント</title>
<desc id="desc">投資信託の商品資料を虫眼鏡で確認するイラスト。投資対象、リスク、費用などを見比べて選ぶことを表す。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8f7f4"/><stop offset="1" stop-color="#d7eaf8"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4f8fb"/></linearGradient>
  <linearGradient id="lens" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a7e7dc" stop-opacity=".7"/><stop offset="1" stop-color="#d6f2f5" stop-opacity=".55"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#cbdedc" stroke-width="2"/>
<text x="64" y="62" font-family="sans-serif" font-size="30" font-weight="800" letter-spacing="1" fill="#087f75">FUND SELECTION</text>
<text x="64" y="111" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">NISAでの投資信託選び</text>
<text x="64" y="151" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">7つのチェックポイント</text>
<path d="M0 570Q170 530 330 575T660 565T970 570T1200 535V675H0Z" fill="#c6e5dc"/>
<!-- large fund report -->
<g transform="translate(290 214) rotate(-5 230 200)">
  <rect x="14" y="15" width="440" height="390" rx="24" fill="#8ba8b6" opacity=".22"/>
  <rect width="440" height="390" rx="24" fill="url(#paper)" stroke="#a9c2cd" stroke-width="4"/>
  <rect x="0" y="0" width="440" height="76" rx="22" fill="#176d65"/>
  <path d="M0 52H440V76H0Z" fill="#176d65"/>
  <text x="34" y="48" font-family="sans-serif" font-size="30" font-weight="800" fill="#fff">投資信託の商品資料</text>
  <circle cx="58" cy="126" r="20" fill="#d8f3eb"/>
  <path d="M48 126l7 8 15-18" fill="none" stroke="#087f75" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="136" font-family="sans-serif" font-size="30" font-weight="800" fill="#203b4d">投資対象</text>
  <rect x="94" y="151" width="260" height="9" rx="4" fill="#dce7ec"/>
  <circle cx="58" cy="205" r="20" fill="#e0edfb"/>
  <path d="M43 211l13-15 10 7 10-15" fill="none" stroke="#2879bd" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="94" y="215" font-family="sans-serif" font-size="30" font-weight="800" fill="#203b4d">値動き・リスク</text>
  <rect x="94" y="230" width="230" height="9" rx="4" fill="#dce7ec"/>
  <circle cx="58" cy="284" r="20" fill="#fff0d4"/>
  <text x="58" y="295" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#a96b09">¥</text>
  <text x="94" y="294" font-family="sans-serif" font-size="30" font-weight="800" fill="#203b4d">保有中の費用</text>
  <rect x="94" y="309" width="280" height="9" rx="4" fill="#dce7ec"/>
  <rect x="28" y="344" width="384" height="28" rx="14" fill="#e1f4ee"/>
  <text x="220" y="365" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#176d65">目論見書で確認</text>
</g>
<!-- magnifying glass -->
<g transform="translate(650 270) rotate(12)">
  <circle cx="145" cy="130" r="122" fill="#fff" opacity=".42"/>
  <circle cx="145" cy="130" r="105" fill="url(#lens)" stroke="#237b91" stroke-width="18"/>
  <circle cx="145" cy="130" r="83" fill="none" stroke="#fff" stroke-width="5" opacity=".8"/>
  <path d="M218 207L310 302Q324 317 310 331L300 341Q286 354 272 339L183 248Z" fill="#176d65" stroke="#10574f" stroke-width="5"/>
  <path d="M231 226L295 291" stroke="#65bcae" stroke-width="9" stroke-linecap="round"/>
  <!-- simple diversified portfolio symbols inside lens -->
  <circle cx="110" cy="115" r="28" fill="#f4bd50"/>
  <path d="M110 87A28 28 0 0 1 138 115H110Z" fill="#e58b42"/>
  <path d="M110 115L89 133A28 28 0 0 1 82 101Z" fill="#e58b42"/>
  <path d="M145 167V128M145 146L124 132M145 154L166 137" fill="none" stroke="#176d65" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M145 167Q120 171 116 147Q139 147 145 167M145 154Q149 127 174 124Q172 148 145 154" fill="#48b99a" stroke="#176d65" stroke-width="3"/>
</g>
<!-- supporting labels -->
<g>
  <rect x="760" y="220" width="310" height="64" rx="32" fill="#fff" stroke="#9bcfc3" stroke-width="3"/>
  <circle cx="796" cy="252" r="14" fill="#087f75"/>
  <path d="M789 252l5 5 10-12" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="824" y="262" font-family="sans-serif" font-size="30" font-weight="800" fill="#175d57">何に投資する？</text>
  <rect x="820" y="555" width="320" height="64" rx="32" fill="#fff" stroke="#a8c8eb" stroke-width="3"/>
  <path d="M850 584l15-14 13 8 16-20" fill="none" stroke="#2879bd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="908" y="597" font-family="sans-serif" font-size="30" font-weight="800" fill="#20568c">値動きは？</text>
</g>
</svg>