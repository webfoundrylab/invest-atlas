<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">NISAでの投資信託選び｜7つのチェックポイント</title>
<desc id="desc">投資信託を選ぶ際に、投資対象やリスク、費用などを確認するイメージ図。</desc>
<rect width="1200" height="675" rx="28" fill="#eaf5f2"/>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#d4e4e0" stroke-width="2"/>
<text x="64" y="63" font-family="sans-serif" font-size="26" font-weight="700" letter-spacing="1" fill="#087f75">CHOOSING A FUND</text>
<text x="64" y="111" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">NISAでの投資信託選び</text>
<text x="64" y="151" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">7つのチェックポイント</text>
<rect x="24" y="190" width="1152" height="461" rx="22" fill="#f8fcfb" stroke="#d4e4e0" stroke-width="2"/>
<g transform="translate(62 258)">
  <rect x="0" y="0" width="320" height="258" rx="24" fill="#d8f4eb" stroke="#8fd5c5" stroke-width="3"/>
  <circle cx="160" cy="82" r="46" fill="#087f75"/>
  <path d="M136 82l17 17 32-37" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="173" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#175d57">投資対象</text>
  <text x="160" y="216" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#386f69">何に投資する？</text>
</g>
<g transform="translate(440 258)">
  <rect x="0" y="0" width="320" height="258" rx="24" fill="#e4effb" stroke="#a7c9ef" stroke-width="3"/>
  <path d="M62 120l50-48 44 26 55-62" fill="none" stroke="#2775c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M190 36h22v22" fill="none" stroke="#2775c8" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M64 151h192" stroke="#8fb5e3" stroke-width="5" stroke-linecap="round"/>
  <text x="160" y="190" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#20568c">リスク</text>
  <text x="160" y="231" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#426f9f">値動きはどの程度？</text>
</g>
<g transform="translate(818 258)">
  <rect x="0" y="0" width="320" height="258" rx="24" fill="#fff0d7" stroke="#f2cc83" stroke-width="3"/>
  <circle cx="160" cy="82" r="46" fill="#f2a51a"/>
  <text x="160" y="100" text-anchor="middle" font-family="sans-serif" font-size="50" font-weight="800" fill="#fff">¥</text>
  <text x="160" y="173" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#885a0b">費用</text>
  <text x="160" y="216" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#946b28">コストはいくら？</text>
</g>
<rect x="310" y="565" width="580" height="54" rx="27" fill="#087f75"/>
<text x="600" y="600" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="800" fill="#fff">自分の目的に合うか確認</text>
</svg>