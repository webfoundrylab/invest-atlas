<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">複利とは？ 投資でお金が増える仕組みとシミュレーション</title>
<desc id="desc">上部のタイトルの下に、単利と複利の増え方の違いを大きな2本の線で示す模式図。</desc>
<rect width="1200" height="675" rx="28" fill="#eaf5f2"/>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#d4e4e0" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#087f75">COMPOUND GROWTH</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">複利とは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">投資でお金が増える仕組みとシミュレーション</text>

<text x="600" y="220" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#286d61">利益が出て、再投資した場合のイメージ</text>
<g><rect x="65" y="285" width="280" height="250" rx="28" fill="#fff" stroke="#9acdbf" stroke-width="4"/><text x="205" y="329" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#536879">最初の元本</text><rect x="125" y="375" width="160" height="70" rx="12" fill="#287d69"/><rect x="140" y="390" width="130" height="40" rx="8" fill="#70c4a7"/><path d="M150 410h110" stroke="#fff" stroke-width="5" stroke-linecap="round"/><text x="205" y="490" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#286d61">運用の土台</text></g>
<path d="M355 410H410m-20-20 22 20-22 20" stroke="#579d8c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect x="425" y="285" width="300" height="250" rx="28" fill="#fff" stroke="#9acdbf" stroke-width="4"/><text x="575" y="329" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#536879">利益が出たら</text><rect x="475" y="380" width="120" height="58" rx="10" fill="#287d69"/><rect x="610" y="355" width="65" height="83" rx="10" fill="#f0c66d"/><text x="535" y="418" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#fff">元本</text><text x="642" y="405" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#765317">利益</text><path d="M490 461H670" stroke="#b4d9cf" stroke-width="5" stroke-linecap="round"/><text x="575" y="497" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#286d61">利益を再投資</text></g>
<path d="M735 410H790m-20-20 22 20-22 20" stroke="#579d8c" stroke-width="10" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g><rect x="805" y="285" width="330" height="250" rx="28" fill="#fff" stroke="#9acdbf" stroke-width="4"/><text x="970" y="329" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#536879">次の運用の土台</text><g><rect x="875" y="430" width="160" height="22" rx="7" fill="#287d69"/><rect x="875" y="405" width="160" height="22" rx="7" fill="#4aa98b"/><rect x="875" y="380" width="160" height="22" rx="7" fill="#f0c66d"/><rect x="875" y="355" width="160" height="22" rx="7" fill="#8bd0b6"/></g><path d="M850 468H1060" stroke="#b4d9cf" stroke-width="5" stroke-linecap="round"/><text x="970" y="505" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#286d61">土台が大きくなる</text></g>
<path d="M1010 560C1010 604 205 604 205 560" fill="none" stroke="#6aa996" stroke-width="5" stroke-dasharray="12 10" stroke-linecap="round"/><path d="M186 577l19-19 19 19" fill="none" stroke="#6aa996" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600" y="636" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#536879">複利は仕組みの説明であり、利益や元本を保証しない</text>
</svg>