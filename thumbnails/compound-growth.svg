<text x="72" y="77" font-family="sans-serif" font-size="30" font-weight="700" letter-spacing="1" fill="#087f75">COMPOUND GROWTH</text>
<text x="72" y="137" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">複利とは？</text>
<text x="72" y="190" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">投資でお金が増える仕組みとシミュレーション</text>
<rect x="32" y="258" width="1136" height="385" rx="22" fill="#f8fcfb" stroke="#d4e4e0" stroke-width="2"/>
<g stroke="#dce9e7" stroke-width="2">
<line x1="100" y1="575" x2="1090" y2="575"/>
<line x1="100" y1="510" x2="1090" y2="510"/>
<line x1="100" y1="445" x2="1090" y2="445"/>
<line x1="100" y1="380" x2="1090" y2="380"/>
<line x1="100" y1="315" x2="1090" y2="315"/>
</g>
<path d="M120 550 C340 530 530 500 710 465 S950 430 1060 405" fill="none" stroke="#7f9db2" stroke-width="11" stroke-linecap="round" stroke-dasharray="20 16"/>
<path d="M120 550 C340 540 515 500 680 435 S900 335 1060 300" fill="none" stroke="#087f75" stroke-width="15" stroke-linecap="round"/>
<g fill="#087f75"><circle cx="120" cy="550" r="11"/><circle cx="430" cy="515" r="11"/><circle cx="700" cy="427" r="11"/><circle cx="1060" cy="300" r="13"/></g>
<rect x="700" y="322" width="300" height="58" rx="29" fill="#d8f4eb"/>
<text x="850" y="360" text-anchor="middle" font-family="sans-serif" font-size="28" font-weight="800" fill="#08766e">複利：増え方が加速</text>
