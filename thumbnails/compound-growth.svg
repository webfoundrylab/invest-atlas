<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">複利とは？ 投資でお金が増える仕組みとシミュレーション</title>
<desc id="desc">上部のタイトルの下に、単利と複利の増え方の違いを大きな2本の線で示す模式図。</desc>
<rect width="1200" height="675" rx="28" fill="#eaf5f2"/>
