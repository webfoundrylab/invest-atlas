<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#e9f0ef"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#557e79" opacity=".035"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#34766e" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#34766e">CURRENCY RISK</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17354a">為替リスクとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="650" fill="#405565">円高・円安が海外投資に与える影響</text>
<g font-family="sans-serif" text-anchor="middle">
  <rect x="330" y="205" width="540" height="104" rx="24" fill="#173f59"/>
  <text x="600" y="250" font-size="36" font-weight="700" fill="#d9eee5">同じ外貨建て資産</text>
  <text x="600" y="292" font-size="48" font-weight="800" fill="#fff">10,000 米ドル</text>
  <path d="M600 309 V340 M584 324 L600 340 L616 324" fill="none" stroke="#34766e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="600" y="386" font-size="40" font-weight="800" fill="#17354a">円に換算すると…</text>
  <path d="M200 418 H1000 M200 418 V444 M600 418 V444 M1000 418 V444" fill="none" stroke="#8aa9a2" stroke-width="5" stroke-linecap="round"/>
  <rect x="65" y="444" width="270" height="172" rx="24" fill="#fff" stroke="#b66d43" stroke-width="5"/>
  <text x="200" y="493" font-size="40" font-weight="800" fill="#98552f">円高</text>
  <text x="200" y="543" font-size="36" font-weight="700" fill="#405565">1ドル＝140円</text>
  <text x="200" y="598" font-size="48" font-weight="800" fill="#17354a">140万円</text>
  <rect x="465" y="444" width="270" height="172" rx="24" fill="#fff" stroke="#397d8a" stroke-width="5"/>
  <text x="600" y="493" font-size="40" font-weight="800" fill="#286d78">基準</text>
  <text x="600" y="543" font-size="36" font-weight="700" fill="#405565">1ドル＝150円</text>
  <text x="600" y="598" font-size="48" font-weight="800" fill="#17354a">150万円</text>
  <rect x="865" y="444" width="270" height="172" rx="24" fill="#fff" stroke="#397c68" stroke-width="5"/>
  <text x="1000" y="493" font-size="40" font-weight="800" fill="#397c68">円安</text>
  <text x="1000" y="543" font-size="36" font-weight="700" fill="#405565">1ドル＝160円</text>
  <text x="1000" y="598" font-size="48" font-weight="800" fill="#17354a">160万円</text>
</g>
