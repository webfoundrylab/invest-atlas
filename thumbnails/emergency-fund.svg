<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">生活防衛資金とは？必要額の計算と備え方</title><desc id="desc">毎月の生活費を基準に、備える期間に応じて生活防衛資金を計算するイメージ。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f2eee8"/><stop offset="1" stop-color="#e7efed"/></linearGradient><filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#263d4a" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g id="invest-atlas-watermark" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#668b83" opacity=".07"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#cbd9d5" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#a45e3c">EMERGENCY FUND</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#102f3b">生活防衛資金とは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">必要額の計算と備え方</text>
<g filter="url(#sh)">
<rect x="80" y="225" width="1040" height="360" rx="28" fill="#fff" fill-opacity=".9" stroke="#d4dfdc" stroke-width="3"/>
</g>
<text x="600" y="282" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#173b45">毎月の生活費 × 備える期間</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="150" y="330" width="250" height="150" rx="20" fill="#f7e8dc" stroke="#ddb99d" stroke-width="3"/>
<rect x="475" y="330" width="250" height="150" rx="20" fill="#e1efeb" stroke="#a6cfc2" stroke-width="3"/>
<rect x="800" y="330" width="250" height="150" rx="20" fill="#e4ebf5" stroke="#b4c6dc" stroke-width="3"/>
<text x="275" y="390" font-size="31" font-weight="800" fill="#a45e3c">3か月分</text><text x="275" y="440" font-size="28" font-weight="750" fill="#173b45">まず試算</text>
<text x="600" y="390" font-size="31" font-weight="800" fill="#176d65">6か月分</text><text x="600" y="440" font-size="28" font-weight="750" fill="#173b45">比較する</text>
<text x="925" y="390" font-size="31" font-weight="800" fill="#315c8c">12か月分</text><text x="925" y="440" font-size="28" font-weight="750" fill="#173b45">状況で調整</text>
</g>
<text x="600" y="535" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#405a63">自分の家計から必要額を決める</text>
</svg>