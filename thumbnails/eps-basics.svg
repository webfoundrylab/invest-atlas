<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">EPSとは？1株当たり利益の計算方法と成長率の見方</title>
<desc id="desc">普通株主に帰属する利益を期中平均株式数で割ると、1株当たり利益であるEPSになることを示す図。</desc>
<rect width="1200" height="675" fill="#e7f0f2"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#287e91" opacity=".07"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#287e91" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#287e91">EARNINGS PER SHARE</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17354a">EPSとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="650" fill="#405565">1株当たり利益の計算方法と成長率の見方</text>
<g font-family="sans-serif" text-anchor="middle">
  <rect x="55" y="258" width="310" height="255" rx="26" fill="#fff" stroke="#287e91" stroke-width="4"/>
  <text x="210" y="335" font-size="40" font-weight="800" fill="#287e91">普通株主の利益</text>
  <path d="M105 365 H315" stroke="#d4e5e8" stroke-width="3"/>
  <text x="210" y="450" font-size="62" font-weight="800" fill="#17354a">12億円</text>
  <text x="410" y="420" font-size="68" font-weight="800" fill="#287e91">÷</text>
  <rect x="445" y="258" width="310" height="255" rx="26" fill="#fff" stroke="#55769a" stroke-width="4"/>
  <text x="600" y="335" font-size="40" font-weight="800" fill="#55769a">期中平均株式数</text>
  <path d="M495 365 H705" stroke="#d4e1ed" stroke-width="3"/>
  <text x="600" y="450" font-size="62" font-weight="800" fill="#17354a">1億株</text>
  <text x="800" y="420" font-size="68" font-weight="800" fill="#287e91">＝</text>
  <rect x="835" y="258" width="310" height="255" rx="26" fill="#e0f1eb" stroke="#168276" stroke-width="4"/>
  <text x="990" y="335" font-size="42" font-weight="800" fill="#087f75">EPS</text>
  <path d="M885 365 H1095" stroke="#b9dcd1" stroke-width="3"/>
  <text x="990" y="450" font-size="66" font-weight="800" fill="#17354a">12円</text>
</g>
<rect x="130" y="555" width="940" height="78" rx="18" fill="#d4e8e7" opacity=".95"/>
<text x="600" y="608" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="800" fill="#244d50">利益だけでなく、株式数でも変わる</text>
</svg>