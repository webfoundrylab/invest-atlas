<rect x="270" y="600" width="660" height="54" rx="27" fill="#6657b5"/>
<text x="600" y="636" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#fff">資産ごとに値動きとリスクが異なる</text>
</svg>