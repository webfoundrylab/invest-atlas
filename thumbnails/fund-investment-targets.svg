<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
<title id="title">投資信託の投資対象</title><desc id="desc">株式、債券、REIT、コモディティ、バランス型の主な投資対象を示す図。</desc>
<rect width="1200" height="630" rx="28" fill="#f3f7f8"/><rect x="42" y="42" width="1116" height="546" rx="24" fill="#fff" stroke="#dce4e8" stroke-width="3"/>
<text x="82" y="112" font-family="sans-serif" font-size="28" font-weight="700" fill="#176d65">INVEST ATLAS / FUND BASICS</text><text x="82" y="168" font-family="sans-serif" font-size="46" font-weight="800" fill="#10243a">投資信託の投資対象</text><text x="82" y="208" font-family="sans-serif" font-size="23" fill="#5c6d7a">何に投資するかで、値動きの要因やリスクが変わる</text>
<g font-family="sans-serif" text-anchor="middle">
<rect x="82" y="254" width="300" height="112" rx="16" fill="#e8f3f0" stroke="#b6d8d0" stroke-width="2"/><text x="232" y="300" font-size="30" font-weight="800" fill="#176d65">株式</text><text x="232" y="337" font-size="19" fill="#405565">企業業績・景気</text>
<rect x="450" y="254" width="300" height="112" rx="16" fill="#edf2f8" stroke="#c8d5e6" stroke-width="2"/><text x="600" y="300" font-size="30" font-weight="800" fill="#285b89">債券</text><text x="600" y="337" font-size="19" fill="#405565">金利・信用力</text>
<rect x="818" y="254" width="300" height="112" rx="16" fill="#f8f0e5" stroke="#ead7b8" stroke-width="2"/><text x="968" y="300" font-size="30" font-weight="800" fill="#916326">REIT</text><text x="968" y="337" font-size="19" fill="#405565">賃料・不動産市況</text>
<rect x="252" y="402" width="300" height="112" rx="16" fill="#f4edf8" stroke="#dec9e8" stroke-width="2"/><text x="402" y="448" font-size="28" font-weight="800" fill="#78519a">商品・コモディティ</text><text x="402" y="485" font-size="19" fill="#405565">需給・為替</text>
<rect x="650" y="402" width="300" height="112" rx="16" fill="#edf4e7" stroke="#cfe0bd" stroke-width="2"/><text x="800" y="448" font-size="28" font-weight="800" fill="#527c36">バランス型</text><text x="800" y="485" font-size="19" fill="#405565">複数資産を組み合わせる</text>
</g><text x="82" y="552" font-family="sans-serif" font-size="18" fill="#5c6d7a">※概念図。複数資産への分散でも損失を防げるとは限りません。</text></svg>