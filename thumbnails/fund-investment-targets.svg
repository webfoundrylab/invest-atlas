<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資信託の投資対象とは？｜株式・債券・REIT・バランス型の違い</title>
<desc id="desc">株式、債券、不動産投資信託、複数資産を組み合わせるバランス型を、それぞれ異なる図柄で比較するイラスト。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eeeaff"/><stop offset="1" stop-color="#d9e8ff"/></linearGradient>
  <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f9f8ff"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="28" fill="url(#bg)"/>
<g data-brand-watermark="invest-atlas" aria-hidden="true" font-family="sans-serif" font-weight="900" fill="#17334a" opacity="0.075"><text x="190" y="390" font-size="132" letter-spacing="2">Invest</text><text x="1010" y="585" text-anchor="end" font-size="132" letter-spacing="2">Atlas</text></g>
<!-- fixed shared title panel -->
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#c9c1ed" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#6657b5">FUND ASSETS</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">投資信託の投資対象とは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">株式・債券・REIT・バランス型の違い</text>
<path d="M0 590Q180 555 390 590T790 582T1200 588V675H0Z" fill="#c9c0f1" opacity=".6"/>
<!-- four distinct asset types -->
<g>
  <!-- equities: rising company chart -->
  <rect x="54" y="224" width="258" height="350" rx="26" fill="#fff" stroke="#b7a9eb" stroke-width="4"/>
  <circle cx="183" cy="331" r="78" fill="#e8e0ff"/>
  <path d="M126 376V342H153V376M165 376V312H192V376M204 376V286H231V376" fill="#8873d5" stroke="#6657b5" stroke-width="4" stroke-linejoin="round"/>
  <path d="M122 387H244" stroke="#6657b5" stroke-width="6" stroke-linecap="round"/>
  <path d="M132 301L163 283L189 294L226 260M208 260H226V278" fill="none" stroke="#d28c36" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="183" y="454" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#51429c">株式</text>
  <text x="183" y="502" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">企業の成長</text>
  <!-- bonds: document with coupon lines -->
  <rect x="342" y="224" width="258" height="350" rx="26" fill="#fff" stroke="#9ec9dc" stroke-width="4"/>
  <circle cx="471" cy="331" r="78" fill="#dff3fa"/>
  <path d="M434 276H489L512 299V385H434Z" fill="#fff" stroke="#3188a7" stroke-width="5" stroke-linejoin="round"/>
  <path d="M489 276V299H512" fill="none" stroke="#3188a7" stroke-width="5" stroke-linejoin="round"/>
  <path d="M447 318H498M447 338H498M447 358H480" stroke="#3188a7" stroke-width="6" stroke-linecap="round"/>
  <circle cx="498" cy="371" r="18" fill="#f2c65c" stroke="#b38325" stroke-width="4"/>
  <text x="471" y="454" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#276b87">債券</text>
  <text x="471" y="502" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">金利・信用力</text>
  <!-- REIT: property buildings -->
  <rect x="630" y="224" width="258" height="350" rx="26" fill="#fff" stroke="#e3b87d" stroke-width="4"/>
  <circle cx="759" cy="331" r="78" fill="#fff0d8"/>
  <path d="M704 379V320L735 302V379Z" fill="#e5a24d" stroke="#a76b23" stroke-width="4" stroke-linejoin="round"/>
  <path d="M739 379V282H782V379Z" fill="#f3c26e" stroke="#a76b23" stroke-width="4" stroke-linejoin="round"/>
  <path d="M786 379V332L814 315V379Z" fill="#d8893e" stroke="#a76b23" stroke-width="4" stroke-linejoin="round"/>
  <g fill="#fff8e9"><rect x="714" y="332" width="9" height="12" rx="2"/><rect x="714" y="353" width="9" height="12" rx="2"/><rect x="750" y="298" width="10" height="12" rx="2"/><rect x="765" y="298" width="10" height="12" rx="2"/><rect x="750" y="321" width="10" height="12" rx="2"/><rect x="765" y="321" width="10" height="12" rx="2"/><rect x="750" y="344" width="10" height="12" rx="2"/><rect x="765" y="344" width="10" height="12" rx="2"/><rect x="797" y="339" width="9" height="12" rx="2"/><rect x="797" y="357" width="9" height="12" rx="2"/></g>
  <text x="759" y="454" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#9b6225">REIT</text>
  <text x="759" y="502" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">不動産</text>
  <!-- balanced: combination pie -->
  <rect x="906" y="224" width="258" height="350" rx="26" fill="#fff" stroke="#9ccbbd" stroke-width="4"/>
  <circle cx="1032" cy="331" r="78" fill="#e0f4ec"/>
  <path d="M1032 331V264A67 67 0 0 1 1097 315Z" fill="#dca346" stroke="#fff" stroke-width="4"/>
  <path d="M1032 331L1097 315A67 67 0 0 1 1050 397Z" fill="#4ca68c" stroke="#fff" stroke-width="4"/>
  <path d="M1032 331L1050 397A67 67 0 0 1 966 352Z" fill="#6c8fd0" stroke="#fff" stroke-width="4"/>
  <path d="M1032 331L966 352A67 67 0 0 1 1032 264Z" fill="#9a82d8" stroke="#fff" stroke-width="4"/>
  <circle cx="1032" cy="331" r="22" fill="#fff" stroke="#9ccbbd" stroke-width="4"/>
  <text x="1035" y="454" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#347c68">バランス型</text>
  <text x="1035" y="502" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">複数資産を組合せ</text>
