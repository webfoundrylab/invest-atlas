<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">全世界株式とは？</title>
<desc id="desc">先進国・新興国の株式を対象にする2つの代表的な指数を比較。MSCI ACWIは大型株・中型株、FTSE Global All Capはそれに加えて小型株も対象とする。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f1eadb"/><stop offset="1" stop-color="#dce9e9"/></linearGradient>
 <linearGradient id="acwi" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#24566c"/><stop offset="1" stop-color="#438b87"/></linearGradient>
 <linearGradient id="ftse" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#76516f"/><stop offset="1" stop-color="#b17b69"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#304b51" opacity=".065"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#cbd8dc" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle" fill="#19384b">
 <text x="600" y="57" font-size="24" font-weight="800" letter-spacing="1">GLOBAL EQUITY INDEXES</text>
 <text x="600" y="116" font-size="48" font-weight="800">全世界株式とは？</text>
 <text x="600" y="157" font-size="30" font-weight="650">MSCI ACWIとFTSEの違い</text>
</g>
<rect x="170" y="195" width="860" height="58" rx="18" fill="#fff" stroke="#c5d5d6" stroke-width="2"/>
<text x="600" y="234" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#294c59">共通：先進国・新興国の株式</text>
<rect x="65" y="275" width="510" height="326" rx="24" fill="#fff" fill-opacity=".88" stroke="#9dbdbb" stroke-width="3"/>
<rect x="625" y="275" width="510" height="326" rx="24" fill="#fff" fill-opacity=".88" stroke="#c9b4c3" stroke-width="3"/>
<text x="320" y="321" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#24566c">MSCI ACWI</text>
<text x="880" y="321" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#76516f">FTSE Global All Cap</text>
<g font-family="sans-serif" font-size="32" font-weight="800" text-anchor="middle" fill="#fff">
 <rect x="105" y="348" width="430" height="82" rx="16" fill="url(#acwi)"/>
 <text x="320" y="400">大型株</text>
 <rect x="105" y="444" width="430" height="82" rx="16" fill="url(#acwi)"/>
 <text x="320" y="496">中型株</text>
 <rect x="665" y="348" width="430" height="70" rx="16" fill="url(#ftse)"/>
 <text x="880" y="395">大型株</text>
 <rect x="665" y="429" width="430" height="70" rx="16" fill="url(#ftse)"/>
 <text x="880" y="476">中型株</text>
 <rect x="665" y="510" width="430" height="70" rx="16" fill="#9a6b42"/>
 <text x="880" y="557">小型株</text>
</g>
<rect x="190" y="615" width="820" height="44" rx="14" fill="#fff" stroke="#cbd8dc" stroke-width="2"/>
<text x="600" y="646" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#344f5d">違いは「小型株まで含むかどうか」</text>
</svg>