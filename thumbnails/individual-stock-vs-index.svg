<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">個別株投資とインデックス投資 仕組み・リスク・費用・手間を比較</title><desc id="desc">個別株は選んだ企業に集中し、インデックス投資は複数企業へ分散する仕組みを比較。</desc>
<rect width="1200" height="675" fill="#e9f0ef"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#557e79" opacity=".07"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#34766e" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#34766e">INVESTMENT STYLE</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17354a">個別株とインデックス投資</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="650" fill="#405565">仕組み・リスク・費用・手間を比較</text>
<rect x="75" y="235" width="470" height="285" rx="28" fill="#fff" stroke="#b66d43" stroke-width="5"/>
<rect x="655" y="235" width="470" height="285" rx="28" fill="#fff" stroke="#287e74" stroke-width="5"/>
<text x="310" y="300" text-anchor="middle" font-size="38" font-weight="800" fill="#98552f" font-family="sans-serif">個別株</text>
<path d="M230 440 V365 H280 V440 M300 440 V340 H350 V440 M370 440 V385 H420 V440" fill="none" stroke="#b66d43" stroke-width="16" stroke-linejoin="round"/>
<text x="890" y="300" text-anchor="middle" font-size="38" font-weight="800" fill="#176d65" font-family="sans-serif">指数の複数銘柄</text>
<g fill="#dcefe9" stroke="#287e74" stroke-width="4"><rect x="735" y="350" width="92" height="92" rx="14"/><rect x="846" y="350" width="92" height="92" rx="14"/><rect x="957" y="350" width="92" height="92" rx="14"/></g>
<g stroke="#176d65" stroke-width="7" fill="none"><path d="M760 420 V380 H802 V420 M871 420 V380 H913 V420 M982 420 V380 H1024 V420"/></g>
<text x="600" y="590" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#294d50">企業を選ぶか、指数のルールを選ぶか</text>
</svg>