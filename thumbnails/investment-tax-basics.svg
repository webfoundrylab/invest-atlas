<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f1f6"/><stop offset="1" stop-color="#dcebe5"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g fill="#1b5860" opacity=".07" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="270" letter-spacing="-8"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#c5d9d8" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#168276">INVESTMENT TAX</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">投資の利益にかかる税金とは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="700" fill="#405d70">株式・投資信託の税率と口座の違い</text>
<g transform="translate(105 240)">
<rect width="445" height="270" rx="28" fill="#fff" stroke="#168276" stroke-width="6"/>
<text x="222" y="70" text-anchor="middle" font-size="43" font-weight="800" fill="#145f58">課税口座</text>
<text x="222" y="160" text-anchor="middle" font-size="76" font-weight="800" fill="#172b3d">20.315%</text>
<text x="222" y="220" text-anchor="middle" font-size="34" font-weight="700" fill="#405d70">利益に課税</text>
</g>
<g transform="translate(650 240)">
<rect width="445" height="270" rx="28" fill="#fff" stroke="#5368a5" stroke-width="6"/>
<text x="222" y="70" text-anchor="middle" font-size="43" font-weight="800" fill="#3f518b">NISA口座</text>
<text x="222" y="160" text-anchor="middle" font-size="76" font-weight="800" fill="#172b3d">非課税</text>
<text x="222" y="220" text-anchor="middle" font-size="34" font-weight="700" fill="#405d70">対象利益は0円</text>
</g>
<rect x="260" y="565" width="680" height="75" rx="22" fill="#173b4d"/>
<text x="600" y="615" text-anchor="middle" font-size="40" font-weight="800" fill="#fff">口座と利益の種類で変わる</text>
</svg>