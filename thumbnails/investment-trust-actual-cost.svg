<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資信託の実質コストとは？｜総経費率との違いと運用報告書の見方</title>
<desc id="desc">運用報告書の費用明細を確認し、信託報酬や売買手数料、その他費用と総経費率を整理するイラスト。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5f5ef"/><stop offset="1" stop-color="#dce9fb"/></linearGradient>
  <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#f4faf8"/></linearGradient>
</defs>
<rect width="1200" height="675" rx="26" fill="url(#bg)"/>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#087f75" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#087f75">INVESTMENT TRUST ACTUAL COST</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">投資信託の実質コストとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">総経費率との違いと運用報告書の見方</text>

<!-- title band -->
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#087f75">FUND COST GUIDE</text>
<path d="M0 570Q180 540 350 570T700 565T1000 570T1200 548V675H0Z" fill="#c5e4d9"/>
<!-- report sheet -->
<g transform="translate(65 238)">
  <rect x="8" y="10" width="430" height="376" rx="20" fill="#7899a3" opacity=".2"/>
  <rect width="430" height="376" rx="20" fill="url(#paper)" stroke="#8ebdb2" stroke-width="4"/>
  <path d="M0 20Q0 0 20 0H410Q430 0 430 20V70H0Z" fill="#176d65"/>
  
  <g font-family="sans-serif" font-size="29" font-weight="700">
    <rect x="20" y="128" width="390" height="60" rx="10" fill="#e2f4ee"/>
    <circle cx="48" cy="158" r="12" fill="#087f75"/><path d="M42 158l5 5 8-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
