    <rect x="20" y="270" width="390" height="60" rx="10" fill="#fff0d5"/>
    <circle cx="48" cy="300" r="12" fill="#c78a20"/><path d="M42 300l5 5 8-10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="72" y="310" fill="#895b10">その他費用</text>
  </g>
</g>
<!-- magnifying glass kept in its own clear space -->
<g transform="translate(480 300) rotate(-8)">
