<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資信託の分配金とは？</title>
<desc id="desc">投資信託の資産から分配金が支払われると、その分だけファンド内の資産が減り、ほかの条件が同じなら基準価額が下がる要因になる。分配金は個別元本との関係で普通分配金と元本払戻金に区分される。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4f0ec"/><stop offset="1" stop-color="#f5e8d8"/></linearGradient>
 <linearGradient id="fund" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24566c"/><stop offset="1" stop-color="#438b87"/></linearGradient>
 <linearGradient id="cash" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#b97816"/><stop offset="1" stop-color="#d49a4c"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g id="invest-atlas-watermark" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#304b51" opacity=".065"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#cbd8dc" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle" fill="#19384b"><text x="600" y="57" font-size="24" font-weight="800" letter-spacing="1">FUND DISTRIBUTIONS</text><text x="600" y="116" font-size="48" font-weight="800">投資信託の分配金とは？</text><text x="600" y="157" font-size="29" font-weight="650">普通分配金・元本払戻金と再投資の考え方</text></g>
<rect x="75" y="220" width="420" height="190" rx="24" fill="#fff" stroke="#7eaaa7" stroke-width="3"/>
<text x="285" y="263" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#19384b">投資信託の資産</text>
<rect x="130" y="288" width="310" height="84" rx="14" fill="url(#fund)"/>
<g fill="#f3d89f"><rect x="154" y="309" width="55" height="42" rx="7"/><rect x="222" y="309" width="55" height="42" rx="7"/><rect x="290" y="309" width="55" height="42" rx="7"/><rect x="358" y="309" width="55" height="42" rx="7"/></g>
<text x="600" y="280" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#8b5b17">分配金を支払う</text>
<path d="M520 315 H680" stroke="#b97816" stroke-width="10" stroke-linecap="round"/><path d="M680 296 L710 315 L680 334 Z" fill="#b97816"/>
<rect x="735" y="220" width="390" height="190" rx="24" fill="#fff" stroke="#d4b47f" stroke-width="3"/>
<text x="930" y="263" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#19384b">投資家が受け取る</text>
<rect x="820" y="292" width="220" height="78" rx="16" fill="url(#cash)"/><text x="930" y="344" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#fff">分配金</text>
<path d="M285 420 V455" stroke="#315d85" stroke-width="6" stroke-linecap="round"/><path d="M269 443 L285 462 L301 443" fill="none" stroke="#315d85" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="75" y="470" width="1050" height="70" rx="18" fill="#19384b"/>
<text x="600" y="516" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="800" fill="#fff">ファンドの資産が減り、基準価額が下がる要因になる</text>
<text x="600" y="584" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#19384b">分配金の税務上の区分は2種類</text>
<rect x="75" y="600" width="500" height="58" rx="15" fill="#dcefeb" stroke="#438b87" stroke-width="2"/><rect x="625" y="600" width="500" height="58" rx="15" fill="#fff0d8" stroke="#b97816" stroke-width="2"/>
<text x="325" y="639" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#194f4c">普通分配金：利益部分</text><text x="875" y="639" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#89580f">元本払戻金：元本の一部</text>
</svg>