<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">投資信託の分配金とは？</title><desc id="desc">普通分配金と元本払戻金の違い、分配金の支払いが基準価額に影響する仕組みを示す。</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e4f5f0"/><stop offset="1" stop-color="#fff0d8"/></linearGradient></defs><rect width="1200" height="675" fill="url(#bg)"/><rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#176d65" stroke-width="2"/><text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#176d65">FUND DISTRIBUTIONS</text><text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#10243a">投資信託の分配金とは？</text><text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">普通分配金・元本払戻金と再投資の考え方</text><rect x="55" y="230" width="490" height="220" rx="24" fill="#fff" stroke="#176d65" stroke-width="4"/><text x="300" y="270" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#10243a">普通分配金</text><g fill="#dcefeb" stroke="#176d65" stroke-width="3"><rect x="120" y="300" width="95" height="82" rx="10"/><rect x="250" y="300" width="95" height="82" rx="10"/><rect x="380" y="300" width="95" height="82" rx="10"/></g><path d="M135 350 L165 320 L195 340 M265 340 L295 315 L325 335 M395 350 L425 325 L455 340" fill="none" stroke="#176d65" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="300" y="420" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#176d65">運用益にあたる部分</text><rect x="655" y="230" width="490" height="220" rx="24" fill="#fff" stroke="#b97816" stroke-width="4"/><text x="900" y="270" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#10243a">元本払戻金</text><g fill="#fff0d2" stroke="#b97816" stroke-width="3"><circle cx="770" cy="340" r="38"/><circle cx="900" cy="340" r="38"/><circle cx="1030" cy="340" r="38"/></g><path d="M790 340 H880 M920 340 H1010" stroke="#b97816" stroke-width="5" stroke-linecap="round"/><path d="M865 326 L882 340 L865 354 M995 326 L1012 340 L995 354" fill="none" stroke="#b97816" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="900" y="420" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#9a5b08">元本の一部払い戻し</text><path d="M300 460 V495 H600 M900 460 V495 H600 V515" fill="none" stroke="#315d85" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M584 500 L600 520 L616 500" fill="none" stroke="#315d85" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="170" y="535" width="860" height="85" rx="20" fill="#10243a"/><text x="600" y="570" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#fff">分配金だけで利益を判断しない</text><text x="600" y="602" text-anchor="middle" font-family="sans-serif" font-size="23" fill="#d7e1e8">基準価額の変化も合わせて確認</text></svg>