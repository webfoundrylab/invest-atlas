<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">一括投資と積立投資はどちらが有利？｜長期実績・数字・暴落時の違いで比較</title>
  <desc id="desc">同じ資金を投資する場合、一括投資は開始時点で全額が市場に参加し、3回の分割投入は時間とともに市場に参加する資金が増えることを示す図。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf7f5"/>
      <stop offset="1" stop-color="#f8f0e8"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f9fcfb"/>
    </linearGradient>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#14786f" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-orange" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11" fill="none" stroke="#d97745" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g id="invest-atlas-watermark" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#176d65" opacity=".065">
    <text x="18" y="400">Invest</text>
    <text x="1180" y="605" text-anchor="end">Atlas</text>
  </g>

  <rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#b8d9d9" stroke-width="2"/>
  <text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#087f75">LUMP SUM vs DCA</text>
  <text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#10243a">一括投資と積立投資はどちらが有利？</text>
  <text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">長期実績・数字・暴落時の違いで比較</text>

  <text x="600" y="222" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#243f50">同じ資金でも、市場に参加するタイミングが違う</text>

  <rect x="54" y="248" width="1092" height="380" rx="28" fill="url(#panel)" stroke="#d5e4e5" stroke-width="2"/>

  <g font-family="sans-serif" font-weight="800">
    <text x="96" y="330" font-size="34" fill="#14786f">一括</text>
    <text x="96" y="493" font-size="34" fill="#d97745">分割</text>
  </g>

  <g stroke="#d8e3e5" stroke-width="2" stroke-dasharray="7 9">
    <line x1="390" y1="292" x2="390" y2="558"/>
    <line x1="650" y1="292" x2="650" y2="558"/>
    <line x1="910" y1="292" x2="910" y2="558"/>
  </g>

  <g font-family="sans-serif" font-weight="700" fill="#536879" font-size="26" text-anchor="middle">
    <text x="390" y="592">開始時</text>
    <text x="650" y="592">1か月後</text>
    <text x="910" y="592">2か月後</text>
  </g>

  <g>
    <rect x="330" y="282" width="730" height="74" rx="16" fill="#e4f3ef" stroke="#9bcfc4" stroke-width="2"/>
    <rect x="330" y="282" width="730" height="74" rx="16" fill="#14786f"/>
    <text x="365" y="330" font-family="sans-serif" font-size="31" font-weight="800" fill="#ffffff">100％</text>
    <text x="520" y="330" font-family="sans-serif" font-size="30" font-weight="700" fill="#ffffff">最初に全額を投資</text>
    <path d="M1030 319 L1082 319" fill="none" stroke="#14786f" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-green)"/>
  </g>

  <g>
    <path d="M330 457 H573 V427 H816 V397 H1060" fill="none" stroke="#d97745" stroke-width="18" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="330" cy="457" r="14" fill="#ffffff" stroke="#d97745" stroke-width="7"/>
    <circle cx="573" cy="427" r="14" fill="#ffffff" stroke="#d97745" stroke-width="7"/>
    <circle cx="816" cy="397" r="14" fill="#ffffff" stroke="#d97745" stroke-width="7"/>
    <g font-family="sans-serif" font-size="29" font-weight="800" fill="#a84f28">
      <text x="365" y="447">約1/3</text>
      <text x="608" y="417">約2/3</text>
      <text x="851" y="387">100％</text>
    </g>
    <path d="M1060 397 L1090 397" fill="none" stroke="#d97745" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
  </g>

  <g font-family="sans-serif" font-size="29" font-weight="700" fill="#536879">
    <text x="600" y="622" text-anchor="middle">分割投入は、投資が完了するまで待機資金が残る</text>
  </g>
</svg>