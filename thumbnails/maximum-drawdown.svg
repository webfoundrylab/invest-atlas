<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">最大ドローダウンの意味と下落幅</title>
<desc id="desc">投資資産が過去の高値から安値へ下落し、その後に高値を回復する推移を示す。高値と安値の差が最大ドローダウン。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4eee8"/><stop offset="1" stop-color="#e9f1f3"/></linearGradient></defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g id="invest-atlas-watermark" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#8a695b" opacity=".075"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#d8d5cf" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#a45b3d">MAXIMUM DRAWDOWN</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#10243a">最大ドローダウンとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">計算方法・回復期間・比較時の注意点を解説</text>
<rect x="70" y="208" width="1060" height="414" rx="26" fill="#fff" fill-opacity=".86" stroke="#d7e1e4" stroke-width="3"/>
<line x1="145" y1="520" x2="1055" y2="520" stroke="#b5c2c5" stroke-width="3"/>
<path d="M150 465 L290 390 L430 285 L570 405 L710 500 L850 420 L990 285 L1060 235" fill="none" stroke="#176d65" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M430 285 L710 500" fill="none" stroke="#c65f3d" stroke-width="8" stroke-dasharray="16 12" stroke-linecap="round"/>
<circle cx="430" cy="285" r="15" fill="#176d65"/><circle cx="710" cy="500" r="15" fill="#c65f3d"/><circle cx="990" cy="285" r="15" fill="#4569a8"/>
<rect x="480" y="340" width="230" height="62" rx="15" fill="#fff0e9" stroke="#e2b49e" stroke-width="2"/>
<text x="595" y="382" text-anchor="middle" font-family="sans-serif" font-size="34" font-weight="850" fill="#a64d32">最大下落 −20%</text>
<g font-family="sans-serif" font-size="30" font-weight="800"><text x="430" y="250" text-anchor="middle" fill="#176d65">過去の高値</text><text x="710" y="565" text-anchor="middle" fill="#a64d32">その後の安値</text><text x="990" y="250" text-anchor="middle" fill="#345a91">回復</text></g>
</svg>