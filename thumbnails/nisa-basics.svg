<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">新NISAとは？</title>
<desc id="desc">NISA口座からつみたて投資枠と成長投資枠につながる仕組みを、口座と分岐図で表現。</desc>
<rect width="1200" height="675" rx="28" fill="#f7f0df"/>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#ead8b7" stroke-width="2"/>
<text x="64" y="63" font-family="sans-serif" font-size="26" font-weight="700" letter-spacing="1" fill="#a9601c">NEW NISA BASICS</text>
<text x="64" y="111" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">新NISAとは？</text>
<text x="64" y="151" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">制度の仕組み・メリット・始め方をわかりやすく解説</text>
<rect x="24" y="190" width="1152" height="461" rx="22" fill="#fffbf3" stroke="#ead8b7" stroke-width="2"/>
<!-- central NISA account -->
<path d="M600 258V300M600 300H310V335M600 300H890V335" fill="none" stroke="#b9a17a" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="300" r="13" fill="#a9601c"/>
<g>
  <rect x="440" y="218" width="320" height="91" rx="20" fill="#a9601c"/>
  <rect x="461" y="236" width="48" height="54" rx="8" fill="#fff0d9"/>
  <path d="M474 251h22M474 262h22M474 273h15" stroke="#a9601c" stroke-width="4" stroke-linecap="round"/>
  <text x="622" y="257" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="700" fill="#ffe8c0">非課税口座</text>
  <text x="622" y="287" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#fff">NISA</text>
</g>
<!-- left branch: steady monthly investing -->
<g>
  <rect x="72" y="335" width="476" height="236" rx="26" fill="#e3f4e9" stroke="#9bd2b4" stroke-width="3"/>
  <text x="104" y="377" font-family="sans-serif" font-size="29" font-weight="800" fill="#216c50">つみたて投資枠</text>
  <text x="104" y="410" font-family="sans-serif" font-size="22" font-weight="650" fill="#397c61">コツコツ積み立てるイメージ</text>
  <g transform="translate(108 436)">
    <rect x="0" y="45" width="54" height="50" rx="8" fill="#68bd91"/>
    <rect x="69" y="28" width="54" height="67" rx="8" fill="#48ab7a"/>
    <rect x="138" y="8" width="54" height="87" rx="8" fill="#279b70"/>
    <path d="M12 28l38-19 38 5 38-14 42 0" fill="none" stroke="#216c50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M151 0h17v17" fill="none" stroke="#216c50" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(345 443)">
    <circle cx="24" cy="20" r="22" fill="#fff"/>
    <text x="24" y="29" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#279b70">¥</text>
    <circle cx="75" cy="57" r="22" fill="#fff"/>
    <text x="75" y="66" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#279b70">¥</text>
  </g>
</g>
<!-- right branch: flexible growth investments -->
<g>
  <rect x="652" y="335" width="476" height="236" rx="26" fill="#e6effc" stroke="#a8c9ef" stroke-width="3"/>
  <text x="684" y="377" font-family="sans-serif" font-size="29" font-weight="800" fill="#20568c">成長投資枠</text>
  <text x="684" y="410" font-family="sans-serif" font-size="22" font-weight="650" fill="#426f9f">幅広い投資先を選ぶイメージ</text>
  <g transform="translate(695 435)">
    <rect x="0" y="34" width="62" height="67" rx="10" fill="#8db7ec"/>
    <rect x="76" y="12" width="62" height="89" rx="10" fill="#5b96df"/>
    <rect x="152" y="0" width="62" height="101" rx="10" fill="#347cc5"/>
    <path d="M12 51l22 17 29-31 25 3 29-22 26 9 30-22" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(950 447)">
    <path d="M0 64l35-36 28 18 43-49" fill="none" stroke="#347cc5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M88 0h18v18" fill="none" stroke="#347cc5" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="22" cy="91" r="8" fill="#8db7ec"/><circle cx="56" cy="91" r="8" fill="#5b96df"/><circle cx="90" cy="91" r="8" fill="#347cc5"/>
  </g>
</g>
<rect x="265" y="590" width="670" height="40" rx="20" fill="#fff0d9"/>
<text x="600" y="617" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="800" fill="#885a0b">運用益が非課税になる制度（元本保証ではありません）</text>
</svg>