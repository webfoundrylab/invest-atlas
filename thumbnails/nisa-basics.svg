<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">新NISAとは？</title>
<desc id="desc">新NISAの非課税メリット、2つの投資枠、年間投資枠と生涯の非課税保有限度額を図解。</desc>
<rect width="1200" height="675" rx="28" fill="#f7f0df"/>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#ead8b7" stroke-width="2"/>
<text x="64" y="63" font-family="sans-serif" font-size="26" font-weight="700" letter-spacing="1" fill="#a9601c">NEW NISA BASICS</text>
<text x="64" y="111" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">新NISAとは？</text>
<text x="64" y="151" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">制度の仕組み・メリット・始め方をわかりやすく解説</text>
<rect x="24" y="190" width="1152" height="461" rx="22" fill="#fffbf3" stroke="#ead8b7" stroke-width="2"/>
<g transform="translate(62 258)">
  <rect width="320" height="258" rx="24" fill="#e0f4e9" stroke="#9ed7b9" stroke-width="3"/>
  <circle cx="160" cy="79" r="48" fill="#279b70"/>
  <path d="M160 48v62M137 68h46M143 92h34" stroke="#fff" stroke-width="7" stroke-linecap="round"/>
  <text x="160" y="173" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#216c50">非課税</text>
  <text x="160" y="216" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#397c61">利益に税金がかからない</text>
</g>
<g transform="translate(440 258)">
  <rect width="320" height="258" rx="24" fill="#e5effc" stroke="#a8c9ef" stroke-width="3"/>
  <rect x="57" y="42" width="92" height="77" rx="14" fill="#347cc5"/>
  <rect x="171" y="42" width="92" height="77" rx="14" fill="#6d9fe0"/>
  <path d="M79 81l15 15 34-39M194 94l17-19 17 11 16-24" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="160" y="173" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#20568c">2つの投資枠</text>
  <text x="160" y="216" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#426f9f">つみたて・成長</text>
</g>
<g transform="translate(818 258)">
  <rect width="320" height="258" rx="24" fill="#fff0d9" stroke="#f0ca87" stroke-width="3"/>
  <rect x="65" y="42" width="190" height="83" rx="13" fill="#f2b544"/>
  <path d="M82 69h156M82 94h104" stroke="#fff6df" stroke-width="9" stroke-linecap="round"/>
  <circle cx="222" cy="105" r="25" fill="#bd7918"/>
  <text x="222" y="114" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#fff">¥</text>
  <text x="160" y="173" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="800" fill="#885a0b">投資枠の上限</text>
  <text x="160" y="216" text-anchor="middle" font-family="sans-serif" font-size="23" font-weight="650" fill="#946b28">年間・生涯で管理</text>
</g>
<rect x="310" y="565" width="580" height="54" rx="27" fill="#a9601c"/>
<text x="600" y="600" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="800" fill="#fff">仕組みを知って無理なく活用</text>
</svg>