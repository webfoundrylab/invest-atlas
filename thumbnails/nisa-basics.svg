<rect x="180" y="593" width="840" height="42" rx="21" fill="#fff0d9"/>
<text x="600" y="623" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#885a0b">2つの投資枠は併用できる</text>
</svg>