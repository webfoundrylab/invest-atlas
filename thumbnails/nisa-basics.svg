<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">新NISAとは？</title>
<desc id="desc">NISA口座からつみたて投資枠と成長投資枠につながる仕組みを、口座と分岐図で表現。</desc>
<rect width="1200" height="675" rx="28" fill="#f7f0df"/>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#ead8b7" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#a9601c">NEW NISA</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#172b3d">新NISAとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">つみたて投資枠・成長投資枠と非課税枠を初心者向けに解説</text>
<rect x="24" y="190" width="1152" height="461" rx="22" fill="#fffbf3" stroke="#ead8b7" stroke-width="2"/>
<path d="M600 285V320M600 320H310V352M600 320H890V352" fill="none" stroke="#b9a17a" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="600" cy="320" r="14" fill="#a9601c"/>
<g>
  <rect x="420" y="214" width="360" height="92" rx="20" fill="#a9601c"/>
  <rect x="442" y="232" width="50" height="56" rx="8" fill="#fff0d9"/>
  <path d="M455 247h24M455 260h24M455 273h17" stroke="#a9601c" stroke-width="5" stroke-linecap="round"/>
  <text x="635" y="254" text-anchor="middle" font-family="sans-serif" font-size="30" font-weight="700" fill="#ffe8c0">非課税口座</text>
  <text x="635" y="288" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#fff">NISA</text>
</g>
<g>
  <rect x="72" y="352" width="476" height="220" rx="26" fill="#e3f4e9" stroke="#9bd2b4" stroke-width="3"/>
  <text x="310" y="399" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#216c50">つみたて投資枠</text>
  <g transform="translate(123 423)">
    <rect x="0" y="72" width="66" height="54" rx="8" fill="#68bd91"/>
    <rect x="83" y="45" width="66" height="81" rx="8" fill="#48ab7a"/>
    <rect x="166" y="14" width="66" height="112" rx="8" fill="#279b70"/>
    <path d="M10 50l48-22 46 8 47-24 44 0" fill="none" stroke="#216c50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M181 12h19v19" fill="none" stroke="#216c50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(398 446)">
    <circle cx="34" cy="27" r="30" fill="#fff"/>
    
    <circle cx="75" cy="92" r="30" fill="#fff"/>
    
  </g>
</g>
<g>
  <rect x="652" y="352" width="476" height="220" rx="26" fill="#e6effc" stroke="#a8c9ef" stroke-width="3"/>
  <text x="890" y="399" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#20568c">成長投資枠</text>
  <g transform="translate(698 429)">
    <rect x="0" y="58" width="68" height="83" rx="10" fill="#8db7ec"/>
    <rect x="83" y="28" width="68" height="113" rx="10" fill="#5b96df"/>
    <rect x="166" y="0" width="68" height="141" rx="10" fill="#347cc5"/>
    <path d="M10 76l26 20 34-36 28 4 32-26 27 11 36-34" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(963 450)">
    <path d="M0 83l43-43 34 19 47-54" fill="none" stroke="#347cc5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M107 5h18v18" fill="none" stroke="#347cc5" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="25" cy="120" r="11" fill="#8db7ec"/><circle cx="69" cy="120" r="11" fill="#5b96df"/><circle cx="113" cy="120" r="11" fill="#347cc5"/>
  </g>
