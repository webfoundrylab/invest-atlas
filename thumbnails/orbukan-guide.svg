<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">全世界株式の投資信託を比較</title>
<desc id="desc">MSCI ACWIに連動する4商品とFTSE Global All Capに連動する3商品を、指数の対象範囲・運用構造・費用で比較する図。前者は大型株と中型株が中心、後者は小型株も含む。</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8efeb"/><stop offset="1" stop-color="#e6e0d7"/></linearGradient>
 <linearGradient id="leftGlobe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24566c"/><stop offset="1" stop-color="#4b9b91"/></linearGradient>
 <linearGradient id="rightGlobe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#76516f"/><stop offset="1" stop-color="#b17b69"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#304b51" flood-opacity=".12"/></filter>
 <clipPath id="clipL"><circle cx="330" cy="390" r="91"/></clipPath>
 <clipPath id="clipR"><circle cx="870" cy="390" r="91"/></clipPath>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#304b51" opacity=".065"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#cbd8dc" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle" fill="#19384b">
 <text x="600" y="57" font-size="24" font-weight="800" letter-spacing="1">GLOBAL INDEX FUNDS</text>
 <text x="600" y="116" font-size="48" font-weight="800">全世界株式の投資信託を比較</text>
 <text x="600" y="157" font-size="30" font-weight="650">オルカン・楽天・SBIなど7商品</text>
</g>
<!-- Two index groups: the key distinction is the market-cap coverage, not a winner. -->
<g filter="url(#shadow)">
 <rect x="76" y="204" width="500" height="350" rx="28" fill="#fbfdfb" stroke="#b7cbc7" stroke-width="3"/>
 <rect x="624" y="204" width="500" height="350" rx="28" fill="#fdfbfc" stroke="#d2bdca" stroke-width="3"/>
</g>
<g font-family="sans-serif" text-anchor="middle" font-weight="800">
 <text x="326" y="250" font-size="36" fill="#24566c">MSCI ACWI</text>
 <text x="874" y="250" font-size="36" fill="#76516f">FTSE Global All Cap</text>
</g>
<!-- Globes share the same world-market base; the right includes additional small-cap markers. -->
<circle cx="326" cy="390" r="99" fill="url(#leftGlobe)"/>
<g clip-path="url(#clipL)" fill="none" stroke="#dcebe5" stroke-width="3" opacity=".72">
 <ellipse cx="326" cy="390" rx="42" ry="91"/><ellipse cx="326" cy="390" rx="91" ry="36"/>
 <path d="M235 390H417M326 299V481"/>
</g>
<g clip-path="url(#clipL)" fill="#f4d89c" stroke="#fff" stroke-width="3">
 <circle cx="287" cy="350" r="13"/><circle cx="353" cy="342" r="16"/><circle cx="369" cy="405" r="14"/><circle cx="302" cy="423" r="17"/><circle cx="335" cy="382" r="13"/>
</g>
<circle cx="874" cy="390" r="99" fill="url(#rightGlobe)"/>
<g clip-path="url(#clipR)" fill="none" stroke="#f0e2e9" stroke-width="3" opacity=".75">
 <ellipse cx="874" cy="390" rx="42" ry="91"/><ellipse cx="874" cy="390" rx="91" ry="36"/>
 <path d="M783 390H965M874 299V481"/>
</g>
<g clip-path="url(#clipR)" fill="#f5d9a1" stroke="#fff" stroke-width="2.5">
 <circle cx="835" cy="350" r="13"/><circle cx="901" cy="342" r="16"/><circle cx="917" cy="405" r="14"/><circle cx="850" cy="423" r="17"/><circle cx="883" cy="382" r="13"/>
</g>
<g clip-path="url(#clipR)" fill="#fff1cf" stroke="#fff" stroke-width="1.5">
 <circle cx="811" cy="385" r="5"/><circle cx="825" cy="446" r="6"/><circle cx="847" cy="315" r="5"/><circle cx="876" cy="455" r="5"/><circle cx="938" cy="365" r="6"/><circle cx="943" cy="431" r="5"/><circle cx="895" cy="310" r="5"/><circle cx="858" cy="365" r="5"/><circle cx="908" cy="448" r="5"/>
</g>
<g font-family="sans-serif" text-anchor="middle" font-weight="750">
 <text x="326" y="510" font-size="32" fill="#19384b">大型・中型株が中心</text>
 <text x="874" y="510" font-size="32" fill="#19384b">小型株まで含む</text>
 <text x="326" y="540" font-size="30" fill="#54717a">4商品</text>
 <text x="874" y="540" font-size="30" fill="#80677b">3商品</text>
</g>
<!-- Shared comparison lenses -->
<g font-family="sans-serif" text-anchor="middle" font-size="32" font-weight="800">
 <rect x="126" y="582" width="280" height="62" rx="18" fill="#fff" stroke="#b9cbc7" stroke-width="2"/>
 <rect x="460" y="582" width="280" height="62" rx="18" fill="#fff" stroke="#b9cbc7" stroke-width="2"/>
 <rect x="794" y="582" width="280" height="62" rx="18" fill="#fff" stroke="#b9cbc7" stroke-width="2"/>
 <text x="266" y="624" fill="#24566c">指数</text>
 <text x="600" y="624" fill="#24566c">運用構造</text>
 <text x="934" y="624" fill="#24566c">費用</text>
</g>
</svg>