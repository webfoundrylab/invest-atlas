<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">全世界株式の投資信託を比較</title>
<desc id="desc">世界を表す地球儀と、異なる運用商品を表す複数のファンドカードを組み合わせた比較イラスト</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7eee9"/><stop offset="1" stop-color="#e7e0d5"/></linearGradient>
 <linearGradient id="globe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24566c"/><stop offset="1" stop-color="#4b9b91"/></linearGradient>
 <linearGradient id="cardA" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4e5c8"/><stop offset="1" stop-color="#d8a66c"/></linearGradient>
 <linearGradient id="cardB" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dce9e4"/><stop offset="1" stop-color="#83aaa0"/></linearGradient>
 <linearGradient id="cardC" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e7dfe9"/><stop offset="1" stop-color="#a88eaa"/></linearGradient>
 <clipPath id="globeClip"><circle cx="600" cy="425" r="154"/></clipPath>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#314b50" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#304b51" opacity=".07"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#cbd8dc" stroke-width="2"/>
<g font-family="sans-serif" text-anchor="middle" fill="#19384b">
 <text x="600" y="57" font-size="24" font-weight="800" letter-spacing="1">GLOBAL INDEX FUNDS</text>
 <text x="600" y="116" font-size="48" font-weight="800">全世界株式の投資信託を比較</text>
 <text x="600" y="157" font-size="30" font-weight="650">オルカン・楽天・SBIなど7商品</text>
</g>
<!-- Seven products represented as a connected set of fund cards; no small lettering is used. -->
