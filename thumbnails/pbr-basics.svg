<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#eee8f5"/>
<g font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#7759a5" opacity=".07"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#7759a5" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#7759a5">PBR</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17354a">PBRとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="650" fill="#405565">株価純資産倍率の計算方法と見方</text>

<g font-family="sans-serif" font-weight="800" text-anchor="middle">
<rect x="80" y="205" width="1040" height="112" rx="22" fill="#fff" stroke="#c9b8dc" stroke-width="3"/>
<text x="600" y="278" font-size="52" fill="#294d50">株価 <tspan fill="#7759a5">÷</tspan> BPS <tspan fill="#7759a5">＝</tspan> PBR</text>
</g>

<g font-family="sans-serif" font-weight="800" text-anchor="middle">
<rect x="75" y="350" width="320" height="220" rx="22" fill="#fff" stroke="#8b78ad" stroke-width="3"/>
<text x="235" y="410" font-size="46" fill="#536f9b">0.7倍</text>
<text x="235" y="458" font-size="36" fill="#294d50">株価 ＜ BPS</text>
<rect x="125" y="485" width="220" height="22" rx="11" fill="#e5e0ec"/>
<rect x="125" y="485" width="103" height="22" rx="11" fill="#7891b8"/>
<path d="M125 522H345" stroke="#536879" stroke-width="3" stroke-linecap="round"/>
<text x="235" y="557" font-size="36" fill="#536f9b">BPSを下回る</text>

<rect x="440" y="350" width="320" height="220" rx="22" fill="#fff" stroke="#6d9b83" stroke-width="3"/>
<text x="600" y="410" font-size="46" fill="#4d8a70">1.0倍</text>
<text x="600" y="458" font-size="36" fill="#294d50">株価 ＝ BPS</text>
<rect x="490" y="485" width="220" height="22" rx="11" fill="#e5e0ec"/>
<rect x="490" y="485" width="147" height="22" rx="11" fill="#78a78d"/>
<path d="M490 522H710" stroke="#536879" stroke-width="3" stroke-linecap="round"/>
<text x="600" y="557" font-size="36" fill="#4d8a70">同じ水準</text>

<rect x="805" y="350" width="320" height="220" rx="22" fill="#fff" stroke="#c69b62" stroke-width="3"/>
<text x="965" y="410" font-size="46" fill="#b78343">1.5倍</text>
<text x="965" y="458" font-size="36" fill="#294d50">株価 ＞ BPS</text>
<rect x="855" y="485" width="220" height="22" rx="11" fill="#e5e0ec"/>
<rect x="855" y="485" width="220" height="22" rx="11" fill="#d1a66c"/>
<path d="M855 522H1075" stroke="#536879" stroke-width="3" stroke-linecap="round"/>
<text x="965" y="557" font-size="36" fill="#b78343">BPSを上回る</text>
</g>
<text x="600" y="635" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="800" fill="#294d50">PBR1倍未満でも、割安とは限らない</text>
</svg>