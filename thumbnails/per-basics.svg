<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">PERとは？株価収益率の計算方法と企業比較での使い方</title>
<desc id="desc">株価をEPSで割るとPERになる。EPSが同じなら株価が高いほどPERも高くなることを示す比較図。</desc>
<rect width="1200" height="675" fill="#f0e9df"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#987342" opacity=".07"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#987342" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#987342">PRICE EARNINGS RATIO</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17354a">PERとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="650" fill="#405565">株価収益率の計算方法と企業比較での使い方</text>
<text x="600" y="244" text-anchor="middle" font-family="sans-serif" font-size="44" font-weight="800" fill="#294d50">株価 ÷ EPS ＝ PER</text>
<g font-family="sans-serif" text-anchor="middle" font-weight="800">
 <rect x="55" y="278" width="520" height="245" rx="26" fill="#fff" stroke="#287e74" stroke-width="4"/>
 <text x="315" y="333" font-size="36" fill="#287e74">株価 2,000円</text>
 <text x="315" y="390" font-size="36" fill="#405565">÷ EPS 100円</text>
 <path d="M155 414 H475" stroke="#d5e5df" stroke-width="3"/>
 <text x="315" y="490" font-size="62" fill="#176d65">PER 20倍</text>
 <rect x="625" y="278" width="520" height="245" rx="26" fill="#fff" stroke="#d78652" stroke-width="4"/>
 <text x="885" y="333" font-size="36" fill="#b36a3f">株価 3,000円</text>
 <text x="885" y="390" font-size="36" fill="#405565">÷ EPS 100円</text>
 <path d="M725 414 H1045" stroke="#eed9ca" stroke-width="3"/>
 <text x="885" y="490" font-size="62" fill="#a65e39">PER 30倍</text>
</g>
<rect x="95" y="557" width="1010" height="78" rx="18" fill="#e8d9c8"/>
<text x="600" y="610" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="800" fill="#624b38">EPSが同じなら、株価が高いほどPERも高い</text>
</svg>