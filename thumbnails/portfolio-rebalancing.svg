<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#e4f0ed"/>
<g font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#247b70" opacity=".035"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#247b70" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#247b70">REBALANCING</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17354a">リバランスとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="650" fill="#405565">値動きで変わった資産配分を整える</text>

<text x="300" y="245" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#24534f">目標配分</text>
<g transform="translate(300 390)"><circle r="118" fill="#d78652"/><path d="M0 0 L0 -118 A118 118 0 1 1 -69.4 95.4 Z" fill="#247b70"/></g>
<text x="300" y="548" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="800" fill="#17354a">株式 60% ／ 債券 40%</text>

<text x="900" y="245" text-anchor="middle" font-family="sans-serif" font-size="42" font-weight="800" fill="#24534f">値動き後</text>
<g transform="translate(900 390)"><circle r="118" fill="#d78652"/><path d="M0 0 L0 -118 A118 118 0 1 1 -112.2 36.5 Z" fill="#247b70"/></g>
<text x="900" y="548" text-anchor="middle" font-family="sans-serif" font-size="40" font-weight="800" fill="#17354a">株式 70% ／ 債券 30%</text>

<!-- 目標配分から値動き後へ -->
<path d="M440 365 H755" stroke="#526c6b" stroke-width="9" stroke-linecap="round"/>
<path d="M715 333 L765 365 L715 397" fill="none" stroke="#526c6b" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<!-- 値動き後から目標配分へ戻す -->
<path d="M760 465 H440" stroke="#247b70" stroke-width="9" stroke-linecap="round"/>
<path d="M475 433 L425 465 L475 497" fill="none" stroke="#247b70" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="490" y="386" width="220" height="62" rx="18" fill="#fff" stroke="#247b70" stroke-width="3"/>
<text x="600" y="427" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#247b70">リバランス</text>

<rect x="350" y="598" width="500" height="58" rx="29" fill="#fff" stroke="#247b70" stroke-width="2"/>
<text x="600" y="638" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="800" fill="#247b70">目標の比率に戻す</text>
</svg>