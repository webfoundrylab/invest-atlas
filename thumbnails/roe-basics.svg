<text x="450" y="365" font-size="62" font-weight="800" fill="#397c68">＝</text>
<rect x="555" y="265" width="250" height="165" rx="24" fill="#173f59"/><text x="680" y="330" font-size="38" font-weight="800" fill="#d9eee5">ROE</text><text x="680" y="395" font-size="62" font-weight="800" fill="#fff">10%</text>
