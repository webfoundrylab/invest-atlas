<rect x="145" y="500" width="910" height="90" rx="24" fill="#fff" stroke="#b8d2c5" stroke-width="3"/><text x="600" y="555" text-anchor="middle" font-family="sans-serif" font-size="39" font-weight="800" fill="#294d50">高ROEの理由と財務リスクを見極める</text></svg>