<g font-family="sans-serif" font-weight="800" fill="#397c68" opacity=".055"><text x="22" y="410" font-size="250">Invest</text><text x="1178" y="610" font-size="250" text-anchor="end">Atlas</text></g>
<rect x="28" y="24" width="1144" height="166" rx="28" fill="#fff" stroke="#397c68" stroke-width="3"/>
<text x="600" y="65" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="800" fill="#397c68">ROE / RETURN ON EQUITY</text>
<text x="600" y="125" text-anchor="middle" font-family="sans-serif" font-size="62" font-weight="800" fill="#17354a">ROEとは？</text>
