<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資をシンプルに考える｜低コスト・分散・長期保有を出発点に</title>
<desc id="desc">落ち着いた道筋と3つの道しるべで、低コスト・分散・長期保有を投資方針の出発点として示す概念図。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff8f1"/><stop offset=".52" stop-color="#f3eaf8"/><stop offset="1" stop-color="#e8e9ef"/></linearGradient>
  <linearGradient id="path" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e65c4f"/><stop offset=".52" stop-color="#ed9a42"/><stop offset="1" stop-color="#8b70bd"/></linearGradient>
  <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd68a"/><stop offset="1" stop-color="#f4a65b"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g id="invest-atlas-watermark" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#9a5c86" opacity=".065">
  <text x="18" y="400">Invest</text>
  <text x="1180" y="605" text-anchor="end">Atlas</text>
</g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#d86c56" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#bd5148">SIMPLE INVESTING</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#30283e">投資をシンプルに考える</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#66566f">低コスト・分散・長期保有を出発点に</text>

<!-- open landscape and one clear path -->
<circle cx="922" cy="278" r="63" fill="url(#sun)" opacity=".95"/>
<path d="M0 470 Q150 390 305 458 T610 448 T900 440 T1200 420 V675 H0Z" fill="#d9cfe4" opacity=".85"/>
<path d="M0 520 Q180 452 360 515 T700 493 T1000 486 T1200 470 V675 H0Z" fill="#c3b6d4"/>
<path d="M0 570 Q180 530 360 560 T720 548 T1000 532 T1200 540 V675 H0Z" fill="#b7c0cc"/>
<path d="M420 675 C445 620 515 590 580 552 C655 510 695 478 725 432 C750 393 787 370 834 349" fill="none" stroke="#fff4e8" stroke-width="104" stroke-linecap="round"/>
<path d="M420 675 C445 620 515 590 580 552 C655 510 695 478 725 432 C750 393 787 370 834 349" fill="none" stroke="url(#path)" stroke-width="72" stroke-linecap="round"/>
<path d="M432 675 C456 622 522 594 586 554 C657 512 699 478 729 432 C753 395 790 372 835 350" fill="none" stroke="#fff4e8" stroke-width="4" stroke-dasharray="12 17" stroke-linecap="round" opacity=".9"/>

<!-- signpost: three principles, large readable shapes -->
<path d="M888 358 L888 595" stroke="#4b4056" stroke-width="20" stroke-linecap="round"/>
<path d="M887 382 L1052 382 L1090 416 L1052 450 L887 450 Z" fill="#d9574f" stroke="#fff7f1" stroke-width="4" stroke-linejoin="round"/>
<text x="978" y="425" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="800" fill="#fff">長期保有</text>
<path d="M888 463 L1034 463 L1072 497 L1034 531 L888 531 Z" fill="#e99a3e" stroke="#fff7f1" stroke-width="4" stroke-linejoin="round"/>
<text x="967" y="506" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="800" fill="#fff">分散</text>
<path d="M888 544 L1015 544 L1053 578 L1015 612 L888 612 Z" fill="#8065ad" stroke="#fff7f1" stroke-width="4" stroke-linejoin="round"/>
<text x="955" y="587" text-anchor="middle" font-family="sans-serif" font-size="31" font-weight="800" fill="#fff">低コスト</text>

