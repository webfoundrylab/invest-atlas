<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資は何を買えばいい？ 迷った人のためのシンプルな考え方</title>
<desc id="desc">生活資金、分散投資、積立と長期保有を整理するための概念イラスト。利益を保証する図ではありません。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3fbf9"/><stop offset="1" stop-color="#e8efff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7fbfc"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g id="invest-atlas-watermark" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#176d65" opacity="0.075">
  <text x="18" y="400">Invest</text>
  <text x="1180" y="605" text-anchor="end">Atlas</text>
</g>
