</g>
<g transform="translate(830 255)">
  <rect width="310" height="350" rx="26" fill="url(#panel)" stroke="#d6e5e6" stroke-width="3"/>
  <rect x="24" y="24" width="262" height="48" rx="14" fill="#e8e3ff"/>
  <text x="155" y="56" font-family="sans-serif" font-size="25" font-weight="800" text-anchor="middle" fill="#5b4ca0">03 無理なく続ける</text>
  <g transform="translate(62 107)">
    <rect x="8" y="16" width="170" height="133" rx="15" fill="#fff" stroke="#8d8bc5" stroke-width="4"/>
    <path d="M8 49 H178" stroke="#8d8bc5" stroke-width="4"/>
    <path d="M44 5 V28 M142 5 V28" stroke="#8d8bc5" stroke-width="7" stroke-linecap="round"/>
    <g fill="#c9c4f5">
      <rect x="28" y="66" width="25" height="22" rx="5"/><rect x="66" y="66" width="25" height="22" rx="5"/><rect x="104" y="66" width="25" height="22" rx="5"/>
      <rect x="28" y="101" width="25" height="22" rx="5"/><rect x="66" y="101" width="25" height="22" rx="5"/>
    </g>
    <path d="M107 116 L128 133 L170 82" fill="none" stroke="#087f75" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="155" y="302" font-family="sans-serif" font-size="23" text-anchor="middle" font-weight="700" fill="#263f52">相場予想よりも</text>
  <text x="155" y="334" font-family="sans-serif" font-size="23" text-anchor="middle" font-weight="700" fill="#263f52">自分のルールを大切に</text>
