<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資をシンプルに考える｜低コスト・分散・長期保有を出発点に</title>
<desc id="desc">低コスト・分散・長期保有の3つの基本方針を、コイン、分散した投資先、時間を表すフラットな図柄で示す。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ef"/><stop offset="1" stop-color="#f0eaf5"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g id="invest-atlas-watermark" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="270" letter-spacing="-8" fill="#8d668e" opacity="0.065"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#d9b5d5" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#98618f">SIMPLE INVESTING</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#30283e">投資をシンプルに考える</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#66566f">低コスト・分散・長期保有を出発点に</text>

