<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">投資は何を買えばいい？ 迷った人のためのシンプルな考え方</title>
<desc id="desc">生活資金、分散投資、積立と長期保有を整理するための概念イラスト。利益を保証する図ではありません。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3fbf9"/><stop offset="1" stop-color="#e8efff"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f7fbfc"/></linearGradient>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect x="42" y="28" width="1116" height="190" rx="24" fill="#fffdf9" stroke="#dbe7e8" stroke-width="2"/>
<text x="72" y="66" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#087f75" letter-spacing="2">A SIMPLE INVESTING GUIDE</text>
<text x="72" y="126" font-family="sans-serif" font-size="43" font-weight="800" fill="#10243a">投資は何を買えばいい？</text>
<text x="72" y="174" font-family="sans-serif" font-size="31" font-weight="700" fill="#526779">迷った人のためのシンプルな考え方</text>
<g transform="translate(60 255)">
  <rect width="310" height="350" rx="26" fill="url(#panel)" stroke="#d6e5e6" stroke-width="3"/>
  <rect x="24" y="24" width="262" height="48" rx="14" fill="#ffeadb"/>
  <text x="155" y="56" font-family="sans-serif" font-size="25" font-weight="800" text-anchor="middle" fill="#87512f">01 生活資金を分ける</text>
  <g transform="translate(60 112)">
    <rect x="10" y="28" width="170" height="115" rx="14" fill="#e5f5ef" stroke="#7bbeb1" stroke-width="4"/>
    <path d="M10 50 H180" stroke="#7bbeb1" stroke-width="4"/>
    <rect x="122" y="65" width="58" height="30" rx="7" fill="#fff" stroke="#7bbeb1" stroke-width="3"/>
    <circle cx="137" cy="80" r="4" fill="#087f75"/>
    <path d="M48 10 H145 L162 28 H31 Z" fill="#ffcf9f" stroke="#d69a64" stroke-width="3"/>
    <path d="M54 83 H97 M54 101 H112" stroke="#087f75" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="155" y="302" font-family="sans-serif" font-size="23" text-anchor="middle" font-weight="700" fill="#263f52">近く使うお金は</text>
  <text x="155" y="334" font-family="sans-serif" font-size="23" text-anchor="middle" font-weight="700" fill="#263f52">投資と分けて考える</text>
