<g transform="translate(445 255)">
  <rect width="310" height="350" rx="26" fill="url(#panel)" stroke="#d6e5e6" stroke-width="3"/>
  <rect x="24" y="24" width="262" height="48" rx="14" fill="#d9f4ec"/>
  <text x="155" y="56" font-family="sans-serif" font-size="25" font-weight="800" text-anchor="middle" fill="#12665f">02 広く分散する</text>
  <g transform="translate(58 105)">
    <circle cx="96" cy="76" r="69" fill="#e2f0ff" stroke="#6e9cc7" stroke-width="4"/>
    <ellipse cx="96" cy="76" rx="31" ry="69" fill="none" stroke="#6e9cc7" stroke-width="3"/>
    <ellipse cx="96" cy="76" rx="60" ry="27" fill="none" stroke="#6e9cc7" stroke-width="3"/>
    <path d="M29 76 H163 M96 9 V145" stroke="#6e9cc7" stroke-width="3"/>
    <path d="M53 47 Q72 35 81 52 L74 70 L54 75 L46 62 Z M115 31 L140 41 L135 60 L119 63 L108 49 Z M88 90 L110 98 L114 117 L99 135 L82 118 Z" fill="#65b79f" opacity=".95"/>
    <circle cx="155" cy="18" r="23" fill="#ffcc77" stroke="#d69a64" stroke-width="3"/>
    <path d="M145 18 H165 M155 8 V28" stroke="#87512f" stroke-width="4" stroke-linecap="round"/>
  </g>
  <text x="155" y="302" font-family="sans-serif" font-size="23" text-anchor="middle" font-weight="700" fill="#263f52">何に投資するかを知り</text>
