<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">株価指数とは？</title>
<desc id="desc">株価指数の値動きを模式的な折れ線で表し、日経平均、TOPIX、S&amp;P 500という代表的な指数を示す図。</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#dff4ef"/><stop offset="1" stop-color="#dce8ff"/></linearGradient></defs>
<rect width="1200" height="675" rx="24" fill="url(#bg)"/>
<g data-brand-watermark="invest-atlas" aria-hidden="true" font-family="sans-serif" font-weight="900" fill="#17334a" opacity="0.075"><text x="190" y="390" font-size="132" letter-spacing="2">Invest</text><text x="1010" y="585" text-anchor="end" font-size="132" letter-spacing="2">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#176d65" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#176d65">STOCK INDICES</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17334a">株価指数とは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="650" fill="#536879">日経平均・TOPIX・S&amp;P 500の違いを初心者向けに解説</text>


<g><rect x="55" y="250" width="300" height="240" rx="26" fill="#fff" stroke="#a2d4c8" stroke-width="4"/><text x="205" y="294" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#236c60">個々の株価</text>
<rect x="88" y="322" width="98" height="68" rx="12" fill="#e3f4ed" stroke="#6db6a5" stroke-width="3"/><path d="M105 369l22-21 18 10 20-22" fill="none" stroke="#267e6b" stroke-width="6" stroke-linecap="round"/><rect x="205" y="322" width="112" height="68" rx="12" fill="#e7effd" stroke="#9cb9e8" stroke-width="3"/><path d="M222 370l20-14 18 5 26-26 14 5" fill="none" stroke="#456eb2" stroke-width="6" stroke-linecap="round"/><rect x="120" y="404" width="112" height="60" rx="12" fill="#fff1d8" stroke="#e5c27b" stroke-width="3"/><path d="M138 444l22-19 18 9 30-21" fill="none" stroke="#a97820" stroke-width="6" stroke-linecap="round"/>
<path d="M370 370H445m-19-20 22 20-22 20" stroke="#438e81" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="460" y="270" width="280" height="200" rx="28" fill="#176d65"/><g transform="translate(540 295)"><rect width="34" height="56" y="60" rx="6" fill="#c8eee2"/><rect width="34" height="81" x="48" y="35" rx="6" fill="#94d7c3"/><rect width="34" height="116" x="96" rx="6" fill="#fff"/></g><text x="600" y="447" text-anchor="middle" font-family="sans-serif" font-size="32" font-weight="800" fill="#fff">株価指数</text>
<path d="M755 370H825m-19-20 22 20-22 20" stroke="#438e81" stroke-width="9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="840" y="250" width="305" height="240" rx="26" fill="#fff" stroke="#a2d4c8" stroke-width="4"/><text x="992" y="294" text-anchor="middle" font-family="sans-serif" font-size="29" font-weight="800" fill="#236c60">市場の動きを見る</text><path d="M875 430H1110M875 335V430" stroke="#c5ddd7" stroke-width="4"/><path d="M888 415l37-32 37 13 37-51 38 22 38-42 25 8" fill="none" stroke="#176d65" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><text x="992" y="464" text-anchor="middle" font-family="sans-serif" font-size="25" font-weight="650" fill="#536879">値動きの目安</text></g>
<text x="600" y="540" text-anchor="middle" font-family="sans-serif" font-size="27" font-weight="800" fill="#536879">代表的な指数の例</text><g font-family="sans-serif" font-size="29" font-weight="800" text-anchor="middle" fill="#176d65"><rect x="160" y="563" width="260" height="60" rx="30" fill="#fff" stroke="#8fc9bb" stroke-width="3"/><text x="290" y="602">日経平均</text><rect x="470" y="563" width="260" height="60" rx="30" fill="#fff" stroke="#8fc9bb" stroke-width="3"/><text x="600" y="602">TOPIX</text><rect x="780" y="563" width="260" height="60" rx="30" fill="#fff" stroke="#8fc9bb" stroke-width="3"/><text x="910" y="602">S&amp;P 500</text></g>
</svg>