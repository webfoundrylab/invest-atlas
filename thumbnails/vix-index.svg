<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">VIXの仕組みと予想変動幅</title>
<desc id="desc">S&amp;P 500のコール・プットオプション価格からVIXを算出し、今後約30日間の上下の変動幅を示す流れ。</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8edf4"/><stop offset="1" stop-color="#d9e5ed"/></linearGradient>
  <marker id="arrow" markerWidth="18" markerHeight="18" refX="14" refY="9" orient="auto" markerUnits="userSpaceOnUse"><path d="M2 2L14 9L2 16" fill="none" stroke="#54758a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<g fill="#52718f" opacity=".065" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="270" letter-spacing="-8"><text x="18" y="400">Invest</text><text x="1180" y="605" text-anchor="end">Atlas</text></g>
<rect x="24" y="22" width="1152" height="150" rx="22" fill="#fff" stroke="#52718f" stroke-width="2"/>
<text x="600" y="57" text-anchor="middle" font-family="sans-serif" font-size="24" font-weight="800" letter-spacing="1" fill="#52718f">VIX INDEX</text>
<text x="600" y="116" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="800" fill="#17354a">VIXとは？</text>
<text x="600" y="157" text-anchor="middle" font-family="sans-serif" font-size="38" font-weight="650" fill="#405565">恐怖指数の仕組みと見方</text>
<rect x="55" y="215" width="1090" height="410" rx="28" fill="#f8fbfd" stroke="#c4d3df" stroke-width="3"/>
<g font-family="sans-serif" text-anchor="middle" fill="#29445b">
  <text x="250" y="285" font-size="42" font-weight="800">S&amp;P 500</text>
  <text x="250" y="330" font-size="38" font-weight="700">オプション</text>
  <rect x="115" y="365" width="270" height="82" rx="16" fill="#eaf1f7" stroke="#9eb4c5" stroke-width="3"/>
  <text x="250" y="420" font-size="42" font-weight="800">コール</text>
  <rect x="115" y="465" width="270" height="82" rx="16" fill="#f9ecea" stroke="#d5a5a0" stroke-width="3"/>
  <text x="250" y="520" font-size="42" font-weight="800">プット</text>
  <path d="M410 455H485" fill="none" stroke="#54758a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <rect x="505" y="335" width="230" height="245" rx="24" fill="#17354a"/>
  <text x="620" y="445" font-size="96" font-weight="900" fill="#fff">VIX</text>
  <text x="620" y="510" font-size="42" font-weight="800" fill="#d9e8ee">予想変動率</text>
  <path d="M760 455H825" fill="none" stroke="#54758a" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="980" y="285" font-size="42" font-weight="800">上下の変動幅</text>
  <path d="M865 455H1090" stroke="#9fb4c2" stroke-width="5" stroke-dasharray="10 10" fill="none"/>
  <path d="M980 455V350" stroke="#d16b62" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M980 350L958 378M980 350L1002 378" stroke="#d16b62" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M980 455V560" stroke="#397eaa" stroke-width="10" stroke-linecap="round" fill="none"/>
  <path d="M980 560L958 532M980 560L1002 532" stroke="#397eaa" stroke-width="10" stroke-linecap="round" fill="none"/>
  <text x="980" y="610" font-size="42" font-weight="900">約30日</text>
</g>
</svg>